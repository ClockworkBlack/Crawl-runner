# Issue topics for candidate positions (statements, transcripts, questionnaires, coverage).
# Matches Electo's profile topics; each is a case-insensitive regular expression. A sentence
# gets every issue whose pattern matches; local-government subjects come from topics.yaml.
issues:
  Abortion: '\b(abortion|pro-?life|pro-?choice|reproductive (?:rights|freedom|health ?care)|heartbeat (?:bill|law)|roe\b|fetal personhood|ivf\b)\b'
  Health care: '\b(health ?care|medicaid|medicare|affordable care act|obamacare|pathways to coverage|insurance premium\w*|prescription|drug prices?|hospital closures?|rural hospitals?|certificate of need|mental health)\b'
  Taxes and budget: '\b(income tax|tax (?:cut|relief|rebate|credit|rate|burden|increase|hike)s?|flat tax|property tax\w*|millage|homestead exemption|budget|spending|deficit|rainy day fund|surplus|fees?\b|sales tax)\b'
  Education: '\b(education|schools?\b|teachers?\b|teacher pay|vouchers?|promise scholarship|school choice|charter schools?|public schools?|curriculum|literacy|classroom|hope scholarship|pre-?k|tuition|university system)\b'
  Guns: '\b(guns?\b|firearms?|second amendment|2a\b|gun (?:control|safety|violence|rights)|constitutional carry|permitless carry|red flag|safe storage|assault weapons?)\b'
  Immigration: '\b(immigra\w+|border|undocumented|illegal aliens?|sanctuary|deport\w*|ice\b|e-?verify|287\(g\)|asylum)\b'
  Elections and voting: '\b(voting rights|voter (?:id|roll|registration|suppression|access|fraud)|election (?:integrity|law|security|board|administration)|absentee|drop box\w*|early voting|sb ?202|ranked[- ]choice|redistricting|gerrymander\w*|hand[- ]count\w*|voting machines?|dominion)\b'
  Energy and utilities: '\b(georgia power|public service commission|psc\b|utility (?:bills?|rates?)|power bills?|electric(?:ity)? rates?|rate (?:hike|increase)s?|vogtle|nuclear|solar|renewable|data cent(?:er|re)s?|natural gas|integrated resource plan|irp\b|energy)\b'
  Labor and wages: '\b(minimum wage|living wage|unions?\b|collective bargaining|right[- ]to[- ]work|workers?\b|paid (?:leave|sick)|overtime|wages?\b|jobs?\b|workforce)\b'
  Criminal justice: '\b(criminal justice|police|law enforcement|crime|public safety|bail|sentencing|prison\w*|jail\w*|gangs?\b|fentanyl|death penalty|recidivism|cash bail|back the blue|defund)\b'
  Housing: '\b(housing|affordable housing|rent\b|renters?|evictions?|homeless\w*|zoning|home ?ownership|institutional investors|squatt\w*|short[- ]term rentals?)\b'
  Environment: '\b((?<!business )(?<!business-)(?<!work )(?<!learning )(?<!regulatory )(?<!economic )(?<!security )(?<!threat )(?<!political )(?<!media )(?<!school )(?<!home )environment(?!\s+(?:for|where|that|in which))\w*|climate(?! (?:for|of) (?:business|investment|growth|innovation))|clean (?:water|air|energy)|pollution|okefenokee|coastal|flood\w*|conservation|pfas|ethylene oxide|wetlands?|forever chemicals)\b'
  Transportation: '\b(transportation|transit|marta|roads?\b|highways?|traffic|infrastructure|rail\b|airport|ports?\b|ev charging|gas tax)\b'
  Tort reform: '\b(tort reform|lawsuit (?:abuse|reform)|trial lawyers|litigation|damages caps?|insurance (?:costs|rates|reform)|sb ?68|premises liability)\b'
  Trump and national politics: '\b(trump|maga|america first|biden|harris|washington|federal government|congress|d\.c\.|the administration|tariffs?|doge\b|federal (?:cuts|funding|overreach))\b'
  Growth and development: '\b(growth|development|sprawl|data cent(?:er|re)s?|rezon\w*|land use|density|annexation|impact fees?|overdevelopment|warehouses?|industrial)\b'
  Water: '\b(water (?:supply|quality|rights|wars?|bills?|system|rates?|infrastructure)|reservoir|aquifer|drought|sewer|wastewater)\b'
  Government ethics and transparency: '\b(ethics|transparen\w*|accountab\w*|corruption|open records|sunshine|term limits?|lobby\w*|conflicts? of interest|campaign finance|dark money|nepotism)\b'
  LGBTQ issues: '\b(lgbtq?\+?|transgender|gender[- ]affirming|same[- ]sex|gay (?:rights|marriage)|drag\b|bathroom bill|trans (?:athletes?|kids|youth|students))\b'
  Religion: '\b(religious (?:liberty|freedom)|faith|church|christian|prayer in schools?|ten commandments|chaplains?)\b'
  Agriculture: '\b(farm\w*|agricultur\w*|poultry|peanuts?|timber|rural (?:georgia|communities|development|broadband))\b'
  Broadband and technology: '\b(broadband|internet access|artificial intelligence|\bai\b|social media|data privacy|cybersecurity|tech)\b'
  Veterans: '\b(veterans?\b|military|armed forces|fort (?:moore|eisenhower|stewart|gordon|benning)|national guard|robins)\b'
  Seniors: '\b(seniors?\b|elderly|retire\w*|social security|aging|nursing homes?|long[- ]term care)\b'
  Gambling: '\b(gambling|casinos?|sports betting|horse racing|lottery|gaming)\b'
  Cannabis: '\b(cannabis|marijuana|medical marijuana|hemp|thc|legaliz\w*|decriminaliz\w*)\b'
  Cityhood and local control: '\b(cityhood|de-?annexation|home rule|local control|consolidation|preemption|buckhead|new city)\b'
