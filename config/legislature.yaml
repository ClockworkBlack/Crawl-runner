# Committee hearing video (gacrawl/legis_video.py, `gacrawl legis video`): bills are linked to the official recording
# of the committee that acted on them, on that day. official_pages: the legislature's own pages; any youtube.com or
# vimeo.com channel they link is used. channels: official channels checked by hand, with the basis.
video:
  since: "2019-01-01"
  official_pages:
    - https://www.senate.ga.gov/spo/en-US/SenateVideo.aspx       # Senate Press Office video page ("Georgia State Senate YouTube Channel")
    - https://www.legis.ga.gov/house/media-services              # House Media Services
    - https://www.legis.ga.gov/senate/press-office               # Senate Press Office
  channels:
    - name: Georgia House of Representatives (Vimeo)
      url: https://vimeo.com/georgiahouse
      basis: "checked by hand 2026-11-07: the account is named Georgia House of Representatives and its videos are dated House committee and study committee meetings; house.ga.gov's own channel page refuses crawlers (robots), so the link from it could not be read"
