_about: |
  School districts' public calendar feeds, checked by hand (gacrawl/district_calendars.py, `gacrawl schools calendars`).
  Discovery reads these first and adds what it finds on the district's own pages (state/district_calendars.json).
  Each feed: url, kind (finalsite_page: a Finalsite calendar page read as served, month by month with ?cal_date=;
  ics: an iCalendar file; edlio_page: an Edlio home page's Upcoming Events; apptegy_json, jsonld_page, rss), platform,
  checked (the day it was opened and seen to carry the calendar), seen (what it showed then), board (true: the board's
  own calendar, where any meeting, session, hearing or committee is the board's). `site` replaces the registry's
  website where that one is wrong, missing or redirects elsewhere. `note`: what a district's site offers when it has no
  feed this reader can use (sampled Nov. 19, 2026). Never a /fs/ address (Finalsite's robots.txt) or an Edlio /apps/
  address (behind a browser check).
districts:
