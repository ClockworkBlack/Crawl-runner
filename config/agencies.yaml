# Georgia state boards, state authorities and regional transit authorities whose public meetings Electo lists
# (Committee Meetings tab). Read by gacrawl/agencies.py (gacrawl agencies), nightly; exported as state_meetings.json in
# the one strict format the bundle's schema.md documents. Every page here was opened during research (boards Nov. 12,
# authorities Nov. 13 and Nov. 19-20, 2026): the body's own page of meeting dates, agendas or minutes. Nothing is a
# built URL.
#
# TO ADD A BODY: add an entry here. That is all, unless its page is laid out in a way the general reader cannot read;
# then add one small reader function to gacrawl/agencies.py, register it in READERS there, name it here (`reader:`),
# and add a saved piece of the page and a test to tests/test_agencies_sites.py.
#
#   id       short id (stays the same: Electo remembers which bodies a reader picked)
#   kind     board (default) | authority (a state authority) | transit (a regional transit authority created by
#            Georgia law, governed by its own board; a city's or county's transit DEPARTMENT is not listed: see the end)
#   name     the body that meets            agency  the department it governs, or what it is (shown beside it)
#   pages    the body's own pages that list its meetings. An entry is an address, or {u: address, reader: name,
#            section: pattern, skip_section: pattern, archive: true, once: true}
#   reader   (optional) the READERS entry that reads these pages; the general reader otherwise
#   follow   (optional) links on those pages to follow one level, by the words in the link's address or text
#   event_pages  true: each meeting's own georgia.gov event page (/events/<day>/...) is opened for its place, hour,
#            agenda and files (once; a past meeting's page is not reopened)
#   event_links  a part of the address of the site's pages for single sessions (the PSC's calendar)
#   match    on a site several bodies share: the words (a pattern) an event or file must carry to be this body's
#   defaults {name, time, where}: what the body's page or every agenda states for all its meetings, used where a
#            meeting's own entry does not say (the reason is written beside each)
#   corrections  a page's own mistake put right: [{d, b, set: {...}, drop: [agenda], move: day, why}]
#   source   archive: the live site refuses automated readers, so the pages are read ONLY from the Internet Archive's
#            existing copies (newest first; never Save Page Now); the export says so and gives the copy's day
#   legacy   drop: records stored before the Nov. 2026 readers were wrong for this body (the Nov. 19 audit) and are
#            not exported; only what the current reader stores is
#   max_pages  how many pages one run may open for the body (14 unless given)
#   links    pages the body sends readers to for what it does not post itself (listed with its pages)
# Not listed: the State Election Board (seb.georgia.gov forbids crawlers in robots.txt).
agencies:
  - id: regents
    name: Board of Regents
    agency: University System of Georgia
    pages:
      - https://www.usg.edu/regents/meetings/
    follow: ["/regents/meetings/date/"]
  - id: sboe
    name: State Board of Education
    agency: Georgia Department of Education
    pages:
      - https://gadoe.org/state-board/board-schedule/
    # the department's agenda and minutes pages hold no files: both send the reader to the board's meeting system
    # (Simbli), which is shown as a link and not read
    links:
      - {t: "Agendas and minutes (the board's meeting system)", u: "https://simbli.eboardsolutions.com/SB_Meetings/SB_MeetingListing.aspx?S=1262"}
  - id: psc
    name: Public Service Commission
    agency: Public Service Commission
    pages:
      - https://psc.ga.gov/agendas-calendars/commission-calendar/
    # the calendar names each session in a link ("Administrative Session 11-17-2026"); last month and next month are
    # one link away (the calendar's own arrows)
    event_links: "/agendas-calendars/commission-calendar/"
    follow: ["commission-calendar/?c=1&m="]
  - id: transportation
    name: State Transportation Board
    agency: Georgia Department of Transportation
    pages:
      - https://www.dot.ga.gov/GDOT/Pages/BoardMeetings.aspx
      - http://www.dot.ga.gov/GDOT/Pages/BoardPresentations.aspx
  - id: community-health
    name: Board of Community Health
    agency: Georgia Department of Community Health
    pages:
      - https://dch.georgia.gov/meetings-notices
    follow: ["board-meeting-schedule", "board-meeting", "/meetings-notices/"]
  - id: natural-resources
    name: Board of Natural Resources
    agency: Georgia Department of Natural Resources
    # the minutes page also holds each committee's minutes (each its own row) and the North Georgia Mountains
    # Authority's (its own entry, ngma, below)
    pages:
      - http://gadnr.org/board
      - {u: "http://gadnr.org/minutes", reader: dated_lines, skip_section: "North Georgia Mountain"}
    defaults:
      name: "Board Meeting"
    legacy: drop
  - id: community-affairs
    name: Board of Community Affairs
    agency: Georgia Department of Community Affairs
    pages:
      - https://dca.georgia.gov/organization/about-department-community-affairs/our-people/dca-board
    follow: ["/events/"]
  - id: behavioral-health
    name: Board of Behavioral Health and Developmental Disabilities
    agency: Georgia Department of Behavioral Health and Developmental Disabilities
    pages:
      - https://dbhdd.georgia.gov/organization/be-informed/dbhdd-board-councils/board-behavioral-health-developmental-disabilities-0
      - https://dbhdd.georgia.gov/past-meetings-archive
  - id: technical-colleges
    name: State Board of the Technical College System of Georgia
    agency: Technical College System of Georgia
    pages:
      - https://www.tcsg.edu/about-tcsg/state-board/
      - https://www.tcsg.edu/about-tcsg/state-board/approved-meeting-minutes/
  - id: public-safety
    name: Board of Public Safety
    agency: Georgia Department of Public Safety
    pages:
      - https://dps.georgia.gov/meeting-dates
      - https://dps.georgia.gov/organization/about-dps/georgia-board-public-safety/board-minutes
    # the dates are in one PDF a year ("2026 Board of Public Safety Meeting Dates"); the minutes on a page a year
    follow: ["board-minutes"]
  - id: corrections
    name: Board of Corrections
    agency: Georgia Department of Corrections
    pages:
      - https://gdc.georgia.gov/organization/about-gdc/board-corrections/board-meeting-minutes
    follow: ["board-meeting-minutes/"]


  # ---------------------------------------------------------------------------------------- state authorities
  # GEFA lists coming meetings on /events and past ones on /past-events (10 pages back to 2017); each meeting's own
  # event page carries its place, hour, the agenda written out, and the loan list. GEFA posts no minutes.
  - id: gefa
    kind: authority
    name: Georgia Environmental Finance Authority
    agency: Georgia Environmental Finance Authority
    pages:
      - https://gefa.georgia.gov/events
      - https://gefa.georgia.gov/past-events
    follow: ["past-events?page="]
    event_pages: true
    max_pages: 70
    legacy: drop
  # The ATL and GRTA became the Georgia Transportation Efficiency Authority (HB 297, signed May 12, 2026). Its board
  # page lists the coming meeting, the year's dates and each past meeting's files by board and committee; its notices
  # (the site's one category of posts) announce work sessions that are not on the board page. The ATL board's own page
  # answers 404 since Nov. 13, 2026: its meetings through Feb. 2026 are read once from the Internet Archive's copy.
  # The id stays atl-transit: readers who picked this authority keep it picked. Every agenda gives the place below
  # (the page's own "Virtual" is the remote access, not the place).
  - id: atl-transit
    kind: authority
    name: Georgia Transportation Efficiency Authority (GTEA; formerly the ATL and GRTA)
    agency: Georgia Transportation Efficiency Authority
    pages:
      - {u: "https://gtea.ga.gov/board/", reader: gtea_board}
      - {u: "https://gtea.ga.gov/category/uncategorized/", reader: notice_posts}
      - {u: "https://atltransit.ga.gov/the-atl-board/", reader: title_table, archive: true, once: true}
    defaults:
      where: "245 Peachtree Center Ave NE, Suite 2300, Atlanta (and Microsoft Teams)"
    links:
      - {t: "GRTA board agendas before the merger (State Road and Tollway Authority's site)", u: "https://srta.ga.gov/srta-board-of-directors-and-leadership/"}
    legacy: drop
  - id: jekyll-island
    kind: authority
    name: Jekyll Island Authority
    agency: Jekyll Island – State Park Authority
    reader: jekyll_board
    pages:
      - https://www.jekyllisland.com/authority/board-directors/
    legacy: drop
  # One board meets as the Student Finance Commission, the Student Finance Authority and the Education Savings
  # Authority, on one day: committees first, then each board. The main page holds the coming year; each year's page
  # (/2026-board-meetings ... /2014-board-meetings) holds that year's agenda, Brief/Actions and minutes. The page says
  # "All meetings start at 9:00 AM and run consecutively".
  - id: student-finance
    kind: authority
    name: Georgia Student Finance Authority
    agency: Georgia Student Finance Commission (the same board also meets as the Georgia Education Savings Authority)
    pages:
      - https://gsfc.georgia.gov/node/1006
    follow: ["-board-meetings"]
    max_pages: 16
    defaults:
      name: "Board meetings (committees, then the GSFC, GSFA and GESA boards)"
      time: "09:00"
    corrections:
      - {d: "2025-02-12", drop: [agenda], set: {name: "Georgia Education Savings Authority special called meeting"},
         why: "only the Education Savings Authority met; the page's agenda link opens the Feb. 2, 2024 agenda"}
      - {d: "2025-03-13", set: {name: "Special called meeting of the three boards", time: "09:45"}, why: "the page says 9:45 AM"}
    legacy: drop
  # GHEFA is staffed by GSFIC and posts on GSFIC's site: its meeting summaries on one page, and each meeting as an
  # event (with its notice) among GSFIC's own events, so only events that name GHEFA are taken.
  - id: ghefa
    kind: authority
    name: Georgia Higher Education Facilities Authority
    agency: Georgia State Financing and Investment Commission
    pages:
      - https://gsfic.georgia.gov/board-meeting-minutes-0
      - https://gsfic.georgia.gov/events
      - https://gsfic.georgia.gov/past-events
    match: "ghefa|higher[- ]education[- ]facilities"
    event_pages: true
    defaults:
      name: "GHEFA Board Meeting"
    links:
      - {t: "Upcoming board meeting agenda (GHEFA's meeting system)", u: "https://simbli.eboardsolutions.com/SB_Meetings/SB_MeetingListing.aspx?S=1001"}
    legacy: drop
  # The minutes page lists board and committee minutes by year; the authority's notices (its Public Notices page and
  # its feed, which also carries special called meetings) give each coming meeting's agenda, place and hour.
  - id: stone-mountain
    kind: authority
    name: Stone Mountain Memorial Association
    agency: Stone Mountain Memorial Association (state authority over Stone Mountain Park)
    pages:
      - {u: "https://stonemountainpark.org/about-us/board-of-directors/meeting-minutes/", reader: smma_minutes}
      - {u: "https://stonemountainpark.org/feed/", reader: notice_posts}
      - {u: "https://stonemountainpark.org/public-notices/", reader: notice_posts}
    legacy: drop
  # Added Nov. 20, 2026 (each page opened Nov. 19-20; robots.txt allows each; gaports.com and srta.ga.gov ask for 10
  # seconds between requests, which the fetcher keeps).
  - id: ports
    kind: authority
    name: Georgia Ports Authority
    agency: Georgia Ports Authority
    pages:
      - https://gaports.com/organization/meeting-notice-agenda/
  - id: lottery
    kind: authority
    name: Georgia Lottery Corporation
    agency: Georgia Lottery Corporation
    pages:
      - https://www.galottery.com/en-us/about-us.html
    defaults:
      name: "Board Meeting"
  - id: srta
    kind: authority
    name: State Road and Tollway Authority
    agency: State Road and Tollway Authority
    pages:
      - https://srta.ga.gov/srta-board-of-directors-and-leadership/
    defaults:
      name: "Board Meeting"
  # the board "will hold its regular quarterly meetings at 10 a.m. in the sixth-floor boardroom" (the page's words)
  - id: gta
    kind: authority
    name: Georgia Technology Authority
    agency: Georgia Technology Authority
    pages:
      - https://gta.georgia.gov/about-us/who-we-are/board-directors
      - https://gta.georgia.gov/about-us/who-we-are/board-directors/board-meeting-presentations
    event_pages: true
    defaults:
      name: "Board Meeting"
      time: "10:00"
      where: "47 Trinity Avenue SW, sixth-floor boardroom, Atlanta"
  - id: savannah-convention
    kind: authority
    name: Savannah-Georgia Convention Center Authority
    agency: Savannah Convention Center (state authority; formerly the Georgia International and Maritime Trade Center Authority)
    reader: month_named
    pages:
      - https://www.savconventioncenter.com/venue-info/governance/
  - id: llida
    kind: authority
    name: Lake Lanier Islands Development Authority
    agency: Lake Lanier Islands Development Authority
    pages:
      - https://llida.georgia.gov/news-and-notices
      - https://llida.georgia.gov/board-directors/meeting-minutes
    event_pages: true
    defaults:
      name: "Board Meeting"
  - id: gba
    kind: authority
    name: Georgia Building Authority
    agency: Georgia Building Authority
    pages:
      - https://gba.georgia.gov/about-us/governing-board/meeting-minutes
    defaults:
      name: "Board Meeting"
  # the page lists the Commission's dates and, beside them, its Foundation's (a private nonprofit): only the Commission's
  - id: gpb
    kind: authority
    name: Georgia Public Telecommunications Commission
    agency: Georgia Public Broadcasting
    reader: dated_lines
    pages:
      - {u: "https://www.gpb.org/about/board", section: "Telecommunications Commission"}
    defaults:
      name: "Commission Meeting"
  # the DNR's minutes page has a section for this authority (Unicoi, Amicalola and Brasstown lodges); its minutes were
  # filed under the Board of Natural Resources until Nov. 2026
  - id: ngma
    kind: authority
    name: North Georgia Mountains Authority
    agency: Georgia Department of Natural Resources (state authority over the North Georgia mountain lodges)
    reader: dated_lines
    pages:
      - {u: "http://gadnr.org/minutes", section: "North Georgia Mountain"}
    defaults:
      name: "Board Meeting"
  # www.gwcca.org answers 403 to automated readers (a browser check). By the owner's rule of Nov. 19, 2026 its About
  # page (the year's meeting schedule; minutes and materials by date) is read from the Internet Archive's existing
  # copies only, the newest first, looked for again every 7 days.
  - id: gwcca
    kind: authority
    name: Georgia World Congress Center Authority
    agency: Georgia World Congress Center Authority
    source: archive
    reader: gwcca_about
    recheck_days: 7
    # One name per committee. The Authority labels a committee's files several ways (seen on its whole page, Nov. 20,
    # 2026: "Executive Finance Committee", "Executive_Finance Committee", "Joint Finance Executive Committee" and
    # "Joint GWCCA Executive & Finance Committee" for one sitting); a label that matches `rx` (case ignored) is filed
    # under `name`, the first match wins. A committee not listed keeps its label's own name. A label with no
    # "Committee" in it is a committee's only as its agenda, minutes or meeting ("COP Meeting Agenda", "Campus Master
    # Plan Preliminary Agenda"): a deck about the park or the plan shown to the board is the board's.
    committees:
      - {name: "Executive Finance Committee", rx: '\bexecutive\W+(?:and\W+)?finance\b|\bfinance\W+(?:and\W+)?executive\b'}
      - {name: "Food & Beverage Review Committee", rx: '\b(?:f\s*&\s*b|fb|food\W+(?:and\W+)?beverage)\s+review\b'}
      - {name: "Centennial Olympic Park Committee", rx: '\bpark committee\b|^(?:cop|centennial olympic park)\W+(?:committee\b|(?:meeting\W+)?(?:prelim\w*\W+)?(?:agenda|minutes)\b|meeting\b)'}
      - {name: "Campus Master Plan Committee", rx: '^campus master plan\W+(?:committee\b|(?:meeting\W+)?(?:prelim\w*\W+)?(?:agenda|minutes)\b|meeting\b)'}
      # the Finance Committee sitting as the OPEB Board of Trustees: one sitting (its agenda under one label, its
      # minutes under the other, on each of the three days of 2016), named for both
      - {name: "Finance Committee", rx: '^finance committee\b|^opeb board of trustees\b'}
    pages:
      - https://www.gwcca.org/about

  # ---------------------------------------------------------------------------------------- regional transit
  # Authorities created by Georgia law with their own boards, whose sites allow reading (robots.txt checked Nov. 19-20,
  # 2026). MARTA: the MARTA Act of 1965 (Ga. L. 1965, p. 2243); owned by Atlanta and Fulton, DeKalb and Clayton
  # counties, not a state authority. Its schedule page is read first (dates and hours for the board, the work sessions
  # and each committee), then this year's and last year's documents; each committee is a body of its own.
  - id: marta
    kind: transit
    name: Metropolitan Atlanta Rapid Transit Authority (MARTA)
    agency: Regional transit authority (Atlanta; Fulton, DeKalb and Clayton counties)
    pages:
      - {u: "https://www.itsmarta.com/meeting-schedule.aspx", reader: marta_schedule}
      - {u: "https://www.itsmarta.com/board-documents.aspx", reader: marta_documents}
      - {u: "https://www.itsmarta.com/board-documents-2025.aspx", reader: marta_documents}
    legacy: drop
  # Chatham Area Transit Authority: the act approved March 28, 1986 (Ga. L. 1986, p. 5082). It announces each board meeting in a news post (day, hour,
  # place); it posts no page of agendas or minutes.
  - id: chatham-transit
    kind: transit
    name: Chatham Area Transit Authority (CAT)
    agency: Regional transit authority (Savannah and Chatham County)
    reader: notice_posts
    pages:
      - https://catchacat.org/category/news/
  # Macon-Bibb County Transit Authority: the Macon-Bibb County Transit Authority Act of 1980 (approved March 26, 1980). Each board meeting is a post (day, hour, place, the
  # agenda written out); its minutes page names minutes by month, filed with that month's meeting where it is known.
  - id: macon-transit
    kind: transit
    name: Macon-Bibb County Transit Authority
    agency: Regional transit authority (Macon-Bibb County)
    pages:
      - {u: "https://mbcta.net/category/board-meetings/", reader: notice_posts}
      - {u: "https://mbcta.net/board-meeting-minutes/", reader: month_named}

# Transit systems NOT listed, because a city or county department runs them (no board of their own that meets): Augusta
# Transit (Augusta-Richmond County), METRA (Columbus Consolidated Government), Athens-Clarke County Transit, CobbLinc
# (Cobb County DOT), Ride Gwinnett (Gwinnett County DOT), Albany Transit System, Rome Transit Department, Hall Area
# Transit / WeGo (Hall County), Henry County Transit, Connect Douglas, Cherokee Area Transportation System, Liberty
# Transit. Xpress commuter buses are the GTEA's (above).

# Bodies whose meetings are not read, and why (shown on the site beside the list of boards)
not_read:
  - name: State Election Board
    why: its site's robots.txt tells crawlers to keep out
    u: https://seb.georgia.gov/
  - name: State Ethics Commission
    why: its meetings page is closed to crawlers by the site's robots.txt
    u: https://ethics.ga.gov/category/commission-meetings/
