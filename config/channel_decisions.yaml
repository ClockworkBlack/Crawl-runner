    status: confirmed
    decided: "2026-11-08"
    by: owner
    found_on: http://www.jeffcityschools.org/
    note: >-
      Linked from Jefferson City Schools' own website; it carries the district's Board meetings.
  UCMxOzyWKnFzRgYpCmdOU-8g:
    title: Fannin Rebel TV
    jurisdiction: sd-fannin
