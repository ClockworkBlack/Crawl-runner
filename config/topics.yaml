# Topic tags for ordinances, agenda items, votes and documents. A record gets every
# topic whose pattern matches its title/text (case-insensitive regular expressions).
# Used to group a council member's votes by subject in the Electo research packets.
topics:
  Zoning and land use: '\b(rezon\w*|zoning|variance|land use|annex\w*|subdivision|special use permit|conditional use|comprehensive plan|future land use|overlay district)\b'
  Housing: '\b(housing|affordable|apartment\w*|multi-?family|townhome\w*|short[- ]term rental\w*|airbnb|homeless\w*)\b'
  Development and incentives: '\b(development authority|tax abatement|bond issu\w*|incentive\w*|economic development|tad\b|tax allocation district|redevelopment|data cent(er|re)s?)\b'
  Budget and taxes: '\b(budget|millage|property tax\w*|sales tax|splost|tsplost|lost\b|fee schedule|fiscal year|appropriation\w*|audit)\b'
  Public safety: '\b(police|sheriff|public safety|fire (department|station|rescue)|ems\b|911|crime|surveillance|license plate reader\w*|flock)\b'
  Alcohol: '\b(alcohol\w*|beer|wine|liquor|pouring|sunday sales|brunch bill|distill\w*|brew\w*)\b'
  Cannabis and hemp: '\b(cannabis|marijuana|hemp|thc|cbd|kratom|vape|vaping)\b'
  Roads and transportation: '\b(road\w*|street\w*|sidewalk\w*|traffic|transit|transportation|paving|bridge\w*|trail\w*|speed hump\w*)\b'
  Water and utilities: '\b(water|sewer|stormwater|utilit\w*|wastewater|electric\w*|natural gas|solid waste|sanitation|garbage|recycling)\b'
  Parks and recreation: '\b(parks?\b|recreation|playground|greenspace|green space|library|libraries)\b'
  Environment: '\b(tree ordinance|tree protection|environment\w*|flood\w*|erosion|wetland\w*|conservation|pollution|landfill)\b'
  Elections and ethics: '\b(election\w*|qualifying fee|ethics|campaign|term limit\w*|redistrict\w*|voting|ballot)\b'
  Government operations: '\b(charter amendment|personnel|salar(y|ies)|compensation|pension|contract\w*|procurement|purchase|intergovernmental agreement|iga\b)\b'
  Business licensing: '\b(business license|occupation tax|vendor\w*|food truck\w*|signage|signs?\b|massage|pawn|title pledge|tattoo)\b'
  Noise and nuisance: '\b(noise|nuisance|curfew|loiter\w*|blight\w*|code enforcement|junk|abandoned)\b'
  Animals: '\b(animal\w*|dogs?\b|cats?\b|chickens?\b|livestock|leash)\b'
  Health and social services: '\b(health|hospital|mental health|opioid\w*|senior center|social services|food bank)\b'
  Schools and youth: '\b(school\w*|education|youth|students?\b|teachers?\b)\b'
