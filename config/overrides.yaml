# Hand edits that win over jurisdictions.yaml and state/discovered.json.
# Keyed by registry id (see config/jurisdictions.yaml). Any field is allowed;
# the useful ones: website, portals (legistar, agenda_center, granicus,
# civicclerk, ecode360, amlegal), tier (a|b|c), enabled (false to skip), notes.
jurisdictions:
  atlanta:
    # atlantaga.gov refuses the crawler; the Atlanta Police Department's own site, given by the project owner (Nov 7)
    police_site: https://www.atlantapd.org/
  canton:
    portals: {legistar: https://canton.legistar.com/}
  powder-springs:
    portals: {legistar: https://powd.legistar.com/}
  columbus-muscogee:
    # columbus.legistar.com is Columbus, OHIO's council system (its records name Franklin County, Ohio, and
    # the Ohio Revised Code). Left empty so the crawler does not read it as Columbus, Georgia. Electo's importer
    # also quarantines any jurisdiction whose records name another state far more often than Georgia.
    portals: {legistar: ""}
  albany:
    portals: {ecode360: https://ecode360.com/AL7106}
  south-fulton:
    # the city's site links youtube.com/cityofsouthfulton in its header social icons (seed's pattern missed the bare form)
    portals: {youtube: "https://www.youtube.com/channel/UCeBB7zv0OQ7utCdcDzx4MAw"}
    youtube_checked: >-
      2026-11-06: cityofsouthfultonga.gov links youtube.com/cityofsouthfulton in its header social icons; the channel
      "City of South Fulton" (@CityofSouthFulton, UCeBB7zv0OQ7utCdcDzx4MAw) streams City Council meetings
      (City Council Meeting 10/27/2026)
  # school districts the seed found no site for (2026-11-06; each site opened and checked)
  sd-henry:
    website: https://www.henry.k12.ga.us/
    website_alt: ''   # the directory's alternate (www.advanc-ed.org) is not the district's: never switched to
    notes: the seed took www.advanc-ed.org (an accreditation site) for it; the district's site answers the crawler with a bot-protection challenge (Nov 17, 2026), so its pages come from the Internet Archive's copies
  sd-barrow:
    website: https://barrow.k12.ga.us/
    notes: board agendas and minutes on the district's eBoard page (barrow.k12.ga.us/334204_2)
  sd-newton:
    website: https://www.newtoncountyschools.org/
    notes: pages are served from newton.ss14.sharpschool.com; agendas, minutes and videos on Simbli
  sd-city-carrollton:
    website: https://www.carrolltoncityschools.net/
  sd-city-dalton:
    website: https://www.daltonpublicschools.com/
  sd-city-decatur:
    website: https://www.csdecatur.net/
    notes: board agendas on Simbli (simbli.eboardsolutions.com, s=4052)
  # Nov 20, 2026 clerk lookup (data/openrecords/clerks.json): the site on file was not the government's, had moved,
  # or had been taken over; each replacement was opened and is the government's own site
  co-candler:
    website: https://candlerco-ga.gov/
    notes: "metter-candler.com on file is the City of Metter's site (checked Nov 20, 2026)"
  co-fannin:
    website: https://fannincountyga.com/
    notes: "fannincountyga.org on file is a Coming Soon placeholder (checked Nov 20, 2026)"
  co-irwin:
    website: https://irwincounty-ga.gov/
    notes: "ocillachamber.net on file is the chamber of commerce (checked Nov 20, 2026)"
  co-miller:
    website: https://www.millercountyga.gov/
    notes: "colquitt-georgia.com on file is not the county's (checked Nov 20, 2026)"
  co-pike:
    website: https://www.pikecoga.gov/
    notes: "pikecoga.com now leads here (checked Nov 20, 2026)"
  co-randolph:
    website: https://www.randolphcountyga.com/
    notes: "randolph.southwest-ga.com on file is not the county's own site (checked Nov 20, 2026)"
  co-terrell:
    website: https://terrellcountyga.gov/
    notes: "terrellcounty-ga.com on file is not the county's own site (checked Nov 20, 2026)"
  braselton:
    website: https://www.braselton.gov/
    notes: "census.gov was on file; GMA prints braselton.gov (robots.txt refuses crawlers: Archive copies only) (checked Nov 20, 2026)"
  culloden:
    website: https://cityofculloden.com/
    notes: "no site was on file (checked Nov 20, 2026)"
  abbeville:
    website: https://cityofabbevillega.gov/
    notes: "abbevillega.org redirects here (checked Nov 20, 2026)"
  dasher:
    website: https://www.dasherga.gov/
    notes: "dasherga.com is parked for sale (checked Nov 20, 2026)"
  plains:
    website: https://plainsgeorgia.gov/
    notes: "plainsgeorgia.org redirects here (checked Nov 20, 2026)"
  claxton:
    website: https://www.cityofclaxton.org/
    notes: "cityofclaxton.net redirects here (checked Nov 20, 2026)"
  climax:
    website: ''
    notes: "cityofclimaxga.com now redirects to a gambling site (checked Nov 20, 2026)"
  hiltonia:
    website: ''
    notes: "townofhiltonia.com now serves a betting page (checked Nov 20, 2026)"
  bartow:
    website: ''
    notes: "townofbartow.com now redirects to a gambling site (checked Nov 20, 2026)"
  pinehurst:
