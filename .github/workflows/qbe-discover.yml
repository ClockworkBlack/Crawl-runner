name: qbe-discover
# What GaDOE's QBE report API answers (gacrawl schools qbe-discover): the reports, their parameters and choices, and
# one generate attempt each, printed to the log. For building or fixing the QBE reader (gacrawl/qbe.py); it stores
# nothing.
on:
  workflow_dispatch:
permissions:
  contents: read
env:
  PYTHONUNBUFFERED: "1"
  GACRAWL_USER_AGENT: "GACivicCrawler/0.3 (+https://github.com/${{ github.repository }})"
jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: pip install -q -e .
      - run: gacrawl schools qbe-discover --max-minutes 10 > qbe.json; python3 -c "import json;print(json.dumps(json.load(open('qbe.json')),indent=1)[:120000])"
