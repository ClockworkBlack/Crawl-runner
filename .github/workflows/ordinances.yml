name: ordinances

# Ordinances downloaded by hand: whenever a file is added or changed under imports/ordinances/ (an upload on
# github.com counts), read every file there into sections and send the result to Electo's data/ordinances/.
# Private repository only: the files and this workflow are never copied to the public Crawl-runner (sync-code.yml).
# Files read before are not read again (Electo's copy is the cache), so a run after one upload takes a few minutes.
# Needs the ELECTO_TOKEN secret (or DATA_TOKEN) with contents write on Electo; without it the run only checks the files.

on:
  push:
    branches: [main]
    paths: ["imports/ordinances/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ordinances
  cancel-in-progress: false

jobs:
  send:
    if: github.repository == 'ClockworkBlack/Crawl'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      ELECTO_TOKEN: ${{ secrets.ELECTO_TOKEN || secrets.DATA_TOKEN }}
      ELECTO_REPO: ${{ vars.ELECTO_REPO || 'ClockworkBlack/Electo' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: pip install -q -e .
      - name: OCR engine, only when there are PDFs or images (scanned pages)
        run: |
          if find imports/ordinances -type f \( -iname '*.pdf' -o -iname '*.png' -o -iname '*.jp*g' -o -iname '*.tif*' -o -iname '*.webp' \) | grep -q .; then
            command -v tesseract >/dev/null || (sudo apt-get update -qq && sudo apt-get install -y -qq tesseract-ocr)
          fi
      - name: Electo's current copy (files read before are reused from it)
        run: |
          mkdir -p /tmp/electo/data/ordinances
          if [ -n "$ELECTO_TOKEN" ]; then
            rm -rf /tmp/electo
            git clone -q --depth 1 --filter=blob:none --sparse "https://x-access-token:${ELECTO_TOKEN}@github.com/${ELECTO_REPO}.git" /tmp/electo
            git -C /tmp/electo sparse-checkout set data/ordinances
            mkdir -p /tmp/electo/data/ordinances
          fi
      - name: Read the files
        run: gacrawl ordinances build --out dist/ordinances --prev /tmp/electo/data/ordinances --report "$GITHUB_STEP_SUMMARY"
      - name: Send to Electo (data/ordinances/)
        if: env.ELECTO_TOKEN != ''
        run: |
          rsync -a --delete dist/ordinances/ /tmp/electo/data/ordinances/
          cd /tmp/electo
          git config user.name "gacrawl-bot"; git config user.email "gacrawl-bot@users.noreply.github.com"
          git add -A data/ordinances
          if git diff --cached --quiet; then echo "Electo already has these" >> "$GITHUB_STEP_SUMMARY"; exit 0; fi
          git commit -qm "Downloaded ordinances from Crawl: $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3 4 5; do git pull --rebase -q && git push -q && { echo "Sent to Electo (data/ordinances/)" >> "$GITHUB_STEP_SUMMARY"; exit 0; }; sleep $((i*5)); done
          exit 1
      - name: No token
        if: env.ELECTO_TOKEN == ''
        run: |
          echo "Not sent: add the ELECTO_TOKEN secret (README, Secrets) so the files reach Electo" >> "$GITHUB_STEP_SUMMARY"
