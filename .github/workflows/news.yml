name: news
# The News tab's stories, read every 10 minutes by one long run: a loop of passes in one process (gacrawl news --every),
# about five and a half hours long, which then starts the next run itself (workflow_dispatch, handoff), so the News tab
# does not depend on GitHub's schedule (whose runs start late or are skipped when it is busy; overnight on Nov 10-11 the
# 20-minute schedule ran about once an hour). The hourly schedule below only restarts the loop if it stopped; a run that
# finds a loop already running ends at once.
# Each pass: the outlets' news APIs and feeds, eight sites at a time (each its own site, the per-host spacing unchanged),
# the first pass in full and later ones asking only for what changed (robots.txt read once; feeds with ETag /
# Last-Modified, an unchanged one answers 304 with no body; a WordPress outlet's list without the posts' text, then the
# text of the new posts only); then scripts/news_pass.sh: Electo's import (ga/crawl_import.py news_from), summaries by
# the open model for the new stories only (Electo tools/ai/news_ai.py, the open model Electo's tools/ai/models.json names, on this runner's CPU, each checked
# against the outlets' text), and the commit and the public site (Electo tools/site_data.sh), only when stories changed.
# The research step from the same stories runs on its own every three hours (news-research.yml). Beside the crawl (its
# own runs), and touches nothing else: no crawl state, no database.
on:
  schedule:
    - cron: "17 * * * *"          # restarts the loop if it stopped (a run that finds one running ends at once)
  workflow_dispatch:
    inputs:
      handoff:
        description: "Started by the loop that just ended (skip the check for a running loop)"
        required: false
        default: "false"

permissions:
  contents: read
  actions: write      # to see whether a loop is running, and for the loop to start the next one

env:
  GACRAWL_USER_AGENT: "GACivicCrawler/0.3 (+https://github.com/${{ github.repository }})"
  PYTHONUNBUFFERED: "1"
  DATA_TOKEN: ${{ secrets.DATA_TOKEN }}
  IS_MAIN: ${{ github.ref_name == github.event.repository.default_branch }}
  HAS_ELECTO_TOKEN: ${{ (secrets.ELECTO_TOKEN || secrets.DATA_TOKEN) != '' }}

jobs:
  gate:
    # one loop at a time: a run that finds another News run going ends here (a few seconds); the loop's own handoff
    # skips the check
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.one.outputs.run }}
    steps:
      - id: one
        env:
          GH_TOKEN: ${{ github.token }}
          HANDOFF: ${{ inputs.handoff }}
        run: |
          if [ "$HANDOFF" = true ]; then echo "run=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          n=$(gh api "repos/${{ github.repository }}/actions/runs?status=in_progress&per_page=100" \
                --jq '[.workflow_runs[] | select(.path == ".github/workflows/news.yml" and .id != ${{ github.run_id }})] | length' 2>/dev/null || echo 0)
          if [ "${n:-0}" -gt 0 ]; then
            echo "a News loop is already running (it reads the outlets every 10 minutes); this run ends here"
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

  news:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Runner mode and state (the outlets' news APIs found by earlier runs)
        run: |
          bash scripts/ci_runner.sh mode
          set -a; . <(grep -E '^(PUBLIC_RUNNER|DATA_REPO)=' "$GITHUB_ENV"); set +a
          bash scripts/ci_runner.sh pull-state
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: pip install -q -e .
      - name: Which open model writes the summaries (Electo tools/ai/models.json; Qwen3.5-9B since Nov 12)
        id: which
        env:
          ELECTO_TOKEN: ${{ secrets.ELECTO_TOKEN || secrets.DATA_TOKEN }}
          ELECTO_REPO: ${{ vars.ELECTO_REPO || 'ClockworkBlack/Electo' }}
        run: |
          K=$(curl -fsSL -H "Authorization: Bearer $ELECTO_TOKEN" -H "Accept: application/vnd.github.raw" \
                "https://api.github.com/repos/$ELECTO_REPO/contents/tools/ai/models.json" \
              | python3 -c "import json,sys; R=json.load(sys.stdin); print(R['models'][R['jobs']['news_summary']['now']]['cache'])" 2>/dev/null) || true
          echo "key=${K:-hf-qwen35-9b-q4km-v1}" | tee -a "$GITHUB_OUTPUT"
      - name: The open model (4-bit; kept between runs)
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: ${{ steps.which.outputs.key }}
      - name: llama.cpp for the model (CPU build; 0.3.36 or later knows Qwen3.5)
        run: |
          pip install -q --prefer-binary "llama-cpp-python>=0.3.36" numpy huggingface_hub \
            --extra-index-url https://abetlen.github.io/llama-cpp-python/whl/cpu || echo "llama.cpp did not install; the stories keep the outlets' excerpts"
      - name: Political news every 10 minutes, then Electo's News tab and the public site (about five and a half hours)
        if: env.HAS_ELECTO_TOKEN == 'true' && env.IS_MAIN == 'true'
        env:
          ELECTO_TOKEN: ${{ secrets.ELECTO_TOKEN || secrets.DATA_TOKEN }}
          ELECTO_REPO: ${{ vars.ELECTO_REPO || 'ClockworkBlack/Electo' }}
          SITE_TOKEN: ${{ secrets.SITE_DATA_TOKEN || secrets.ELECTO_TOKEN }}
          SITE_DATA_REPO: ${{ vars.SITE_DATA_REPO || 'ClockworkBlack/electo-data' }}
          # the summaries' model is the one Electo's tools/ai/models.json gives this job (read at every pass, so a
          # change there, by the monthly trials or the pass-rate watch, takes effect within ten minutes; a model not
          # in the runner's cache is downloaded once). Qwen3.5-9B since Nov 12: it passed the checker on 84% of 120
          # logged stories against Qwen3-8B's 80%, faster (Electo research/train/replay.json).
          ELECTO_LLM_JOB: news_summary
        run: |
          gacrawl news --max-minutes 4 --export dist/news/news.json --every 10 --for 315 --then "bash scripts/news_pass.sh"
      - name: The next loop (this run hands over; cancelling a run stops the chain, and the hourly schedule restarts it)
        if: success() && env.IS_MAIN == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run news.yml -R "${{ github.repository }}" --ref "${{ github.ref_name }}" -f handoff=true || echo "the next loop could not be started; the hourly schedule starts it"
