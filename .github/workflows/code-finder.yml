name: code-finder

# For the places with no downloaded code (imports/ordinances/): read each one's own website a little deeper
# (gacrawl/codefinder.py), largest first, each at most once a month:
#   - a code of ordinances, charter or zoning / development code posted as a PDF or Word file is downloaded into
#     imports/ordinances/<id>/ (with sources.csv), and the ordinances workflow is started so it reaches Electo;
#   - the clerk / open-records address or portal the site publishes goes to data/openrecords/found.json, which
#     records-send uses for places the seed found no address for;
#   - a link to the code on a code library (Municode, ...) is listed in data/openrecords/online_codes.md.
# A place with no website gets the one GMA's city directory lists. Private repository only (addresses, downloads):
# sync-code.yml never copies this workflow to the public runner.

on:
  schedule:
    - cron: "17 6 * * *"     # 1:17 AM Eastern (2:17 in summer), after the crawl's busy hours
  workflow_dispatch:
    inputs:
      only:
        description: "Only these place ids, comma-separated (looked at again even if checked recently)"
        required: false

permissions:
  contents: write
  actions: write     # start the ordinances workflow for new downloads

concurrency:
  group: openrecords   # shares data/openrecords with records-send
  cancel-in-progress: false

env:
  GH_TOKEN: ${{ github.token }}

jobs:
  find:
    if: github.repository == 'ClockworkBlack/Crawl'
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/imports/ordinances/GA/
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: pip install -q -e .
      - name: Read the sites
        env:
          ONLY: ${{ github.event.inputs.only }}
          ORR_FROM: ${{ secrets.ORR_FROM }}      # the crawler's contact address in its User-Agent
        run: |
          if [ -n "$ONLY" ]; then
            gacrawl records find --max-minutes 40 --only "$ONLY" | tee -a "$GITHUB_STEP_SUMMARY"
          else
            gacrawl records find --max-minutes 40 | tee -a "$GITHUB_STEP_SUMMARY"
          fi
      - name: Commit what was found
        if: always()
        run: |
          git config user.name "gacrawl-bot"; git config user.email "gacrawl-bot@users.noreply.github.com"
          git add data/openrecords imports/ordinances 2>/dev/null || true
          git diff --cached --quiet && exit 0
          NEW_CODES=$(git diff --cached --name-only -- imports/ordinances | head -1)
          git commit -qm "Code finder: addresses and posted codes $(date -u +%Y-%m-%d)"
          for i in 1 2 3 4 5; do
            if git pull --rebase --autostash -q origin main && git push -q origin HEAD:main; then
              # a push made with this job's token doesn't start other workflows, so start the ordinances one here
              [ -n "$NEW_CODES" ] && { gh workflow run ordinances.yml --ref main || true; }
              exit 0
            fi
            sleep $((i*5))
          done
          exit 1
