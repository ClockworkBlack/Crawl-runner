name: sync-code

# Runs in the PUBLIC runner repository only (config/runner.json runner_repo), on its free minutes. It is scheduled every
# 15 minutes, but GitHub delays and drops scheduled runs under load and starts it about once an hour (Nov 2026: about
# 40 runs a day, not 96), so a run here is saved and deleted within about an hour of its end:
#   1. copies the crawler's code from the private repository, the code only: state/, data/, imports/, config/private/
#      (what the crawler gathered, contacts, the requester's signature, hand-downloaded ordinances) and the records-request
#      mail workflows never leave the private repository (the ordinances workflow runs here: it reads the downloaded
#      files from the private repository into its own runner and sends them only to Electo)
#   2. stores every finished run's full logs in the private LogView repository (crawl-runner/<day>/: the logs zip, the
#      run's jobs, steps and GitHub's error notes, the day's digest; LogView's tools/collect.py writes them, the same
#      shape as the other projects there) and then deletes the run here, so the public repository keeps no logs once
#      they are stored. A run is deleted only when LogView's pushed commit holds it; with LOGVIEW_WRITE missing or
#      LogView out of reach nothing is deleted, the step fails, and the next run tries again. Nothing of the logs is
#      kept in the private Crawl repository any more (logs/runner, until late November 2026: step 3 moves that archive
#      into LogView, once).
#   Needs DATA_TOKEN (the code, the run status, the old archive) and LOGVIEW_WRITE (LogView's README says how to make it).
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  actions: write        # read finished runs and their logs here, and delete them once LogView holds them
  checks: read          # the error notes GitHub attaches to a failed job (kept with its logs)

concurrency:
  group: sync-code
  cancel-in-progress: false

jobs:
  sync:
    if: github.repository == 'ClockworkBlack/Crawl-runner'
    runs-on: ubuntu-latest
    timeout-minutes: 20       # every run's logs are read and pushed to LogView here; the first time, a month's archive too
    env:
      DATA_TOKEN: ${{ secrets.DATA_TOKEN }}
    steps:
      - name: Copy the code from the private repository
        run: |
          set -euo pipefail
          git clone -q --depth 1 "https://x-access-token:${DATA_TOKEN}@github.com/ClockworkBlack/Crawl.git" src
          git clone -q "https://x-access-token:${DATA_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" pub
          SHA=$(git -C src rev-parse --short HEAD)
          rsync -a --delete \
            --exclude .git --exclude state/ --exclude data/ --exclude imports/ --exclude config/private/ --exclude logs/ \
            --exclude .github/workflows/records-send.yml --exclude .github/workflows/records-test.yml \
            --exclude outbox/ --exclude .github/workflows/mail-send.yml \
            src/ pub/
          # excluded paths are also never kept here (rsync --delete leaves excluded paths alone, so remove them)
          rm -rf pub/state pub/data pub/imports pub/config/private pub/logs \
                 pub/.github/workflows/records-send.yml pub/.github/workflows/records-test.yml \
                 pub/outbox pub/.github/workflows/mail-send.yml
          if grep -rIlE "Humble Servant|ORR_PASSWORD=|@gmail\.com" pub --exclude-dir=.git --exclude=sync-code.yml >/dev/null 2>&1; then
            echo "::error::private text found in the copy; nothing pushed"; grep -rIlE "Humble Servant|@gmail\.com" pub --exclude-dir=.git; exit 1
          fi
          cd pub
          git config user.name "gacrawl-bot"; git config user.email "gacrawl-bot@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            # GitHub turns a public repository's schedules off after 60 days without activity, and a quiet stretch with
            # no code change would stop every job here, the watchdog with them: an empty commit every 45 days keeps them on
            if [ $(( $(date +%s) - $(git log -1 --format=%ct) )) -gt $(( 45 * 86400 )) ]; then
              git commit -q --allow-empty -m "Keep the schedules on (no code change in 45 days)" && git push -q origin HEAD:main && echo "keep-alive commit pushed"
            fi
            echo "already in sync ($SHA)"; exit 0
          fi
          git commit -qm "Code from the private repository ($SHA)"
          git push -q origin HEAD:main
          echo "synced $SHA"
      - name: Store finished runs' logs in LogView, then delete the runs here
        # Every finished run of this repository: LogView's own collector (tools/collect.py --only crawl-runner, with
        # this job's token) writes its logs zip, its jobs with GitHub's error notes and the day's digest into LogView's
        # crawl-runner/<day>/, this step pushes that with LOGVIEW_WRITE, and only then deletes each run whose row (and
        # zip) the pushed commit holds. Until late November 2026 the logs went to the private Crawl repository
        # (logs/runner), some jobs' only, and LogView held digests of them.
        # This log is public: of the collector's output only its one-line count is shown, and of the runs their ids.
        env:
          GH_TOKEN: ${{ github.token }}
          LOGVIEW_WRITE: ${{ secrets.LOGVIEW_WRITE }}
        run: |
          set -uo pipefail
          HERE="$PWD"; LV="$RUNNER_TEMP/logview"; OUT="$RUNNER_TEMP/collect.out"; rows=$(mktemp); del=$(mktemp)
          trap 'rm -rf "$LV" "$OUT"' EXIT
          # the finished runs, one a line, tab-separated (a run's name may hold spaces, GitHub's own "pages build and
          # deployment": the unquoted for-loop used until Nov 19 split such a row into words, so the run was deleted
          # with no record and its other words were sent to DELETE as run ids). Listed before the collector runs, so
          # that every run of the list is one the collector saw.
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs?status=completed&per_page=100" \
            --jq '.workflow_runs[] | select(.id != '"${GITHUB_RUN_ID}"') | [.id, (.name // "run"), .created_at, (.conclusion // "unknown"), .updated_at, (.run_attempt // 1)] | @tsv' > "$rows" \
            || { echo "::error title=Run logs::could not list the finished runs: nothing stored or deleted"; exit 1; }
          # the collector looks back by the day a run started: as far as the oldest run still here (a run waits here
          # when LogView could not be reached; GitHub itself drops logs after 90 days)
          oldest=$(cut -f3 "$rows" | sort | head -1)
          DAYS=1; [ -n "$oldest" ] && DAYS=$(( ( $(date -u -d "$(date -u +%F)" +%s) - $(date -u -d "${oldest:0:10}" +%s) ) / 86400 + 1 ))
          [ "$DAYS" -gt 90 ] && DAYS=90
          stored=no
          if [ -z "${LOGVIEW_WRITE:-}" ]; then
            echo "::error title=Run logs::the LOGVIEW_WRITE secret is not set here, so the runs' logs cannot be stored in LogView: no run is deleted until it is (LogView's README.md says how to make the token)"
          elif ! git clone -q --depth 1 --filter=blob:none --sparse "https://x-access-token:${LOGVIEW_WRITE}@github.com/ClockworkBlack/LogView.git" "$LV" 2>/dev/null; then
            echo "::error title=Run logs::could not read LogView with LOGVIEW_WRITE (expired, or no longer given LogView?): no run is deleted"
          else
            # the collector, the digests and each day's index; not the logs already stored (the folder grows every day)
            git -C "$LV" sparse-checkout set --no-cone /tools/ /crawl-runner/README.md '/crawl-runner/*/index.json' '/crawl-runner/*/README.md'
            cd "$LV"
            # (rc=0 first: the step's shell stops at a failed command, so "cmd; rc=$?" never saw a failure; the
            # collector is given the token that reads this repository's runs and no other)
            rc=0; env -u DATA_TOKEN -u LOGVIEW_WRITE python3 -I tools/collect.py --only crawl-runner --days "$DAYS" > "$OUT" 2>&1 || rc=$?
            count=$(grep '^collected ' "$OUT" | tail -1 || true)
            echo "${count:-the collector printed no count}"
            if [ "$rc" != 0 ]; then
              echo "::error title=Run logs::LogView's collector could not read this repository's runs (exit $rc): no run is deleted"
            else
              git config user.name "LogView collector"
              git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
              if [ -d crawl-runner ]; then git add --sparse -A crawl-runner; fi
              if git diff --cached --quiet; then
                stored=yes                       # nothing new: what LogView holds is what was cloned
              else
                git commit -q -m "Logs: Crawl-runner, $count"
                # logview and OpenResearch also push to LogView (other folders): on a race, take their commit and try again
                for i in 1 2 3 4 5; do
                  git pull -q --rebase origin main 2>/dev/null && git push -q origin HEAD:main 2>/dev/null && { stored=yes; break; }
                  git rebase --abort 2>/dev/null || true
                  sleep $((i * 5))
                done
                if [ "$stored" = yes ]; then echo "pushed to LogView"; else echo "::error title=Run logs::could not push to LogView: no run is deleted"; fi
              fi
            fi
            cd "$HERE"
          fi
          # each job's last outcome and last success (runner-status.json, an asset of the private crawl-data release, so it
          # adds no commits): the watchdog reads it to find a job that keeps failing or has stopped running, which the
          # deleted runs would otherwise hide. Every finished run is recorded the first time it is seen here, stored
          # or not, so that the watchdog still sees the jobs while LogView cannot be reached.
          mkdir -p status && GH_TOKEN="$DATA_TOKEN" gh release download crawl-data -R ClockworkBlack/Crawl -p runner-status.json -D status --clobber 2>/dev/null || true
          python3 - "$rows" status/runner-status.json "$stored" "$LV" "$del" <<'PY' && [ -s status/runner-status.json ] && { GH_TOKEN="$DATA_TOKEN" gh release upload crawl-data status/runner-status.json -R ClockworkBlack/Crawl --clobber >/dev/null && echo "run status recorded" || echo "::warning::run status not uploaded"; } || true
          import json, os, subprocess, sys
          rows, path, stored, lv, delf = sys.argv[1:6]
          pushed = stored == "yes"
          def kept(p):
              """A file of LogView's crawl-runner folder: as the pushed commit holds it, or (nothing pushed) as the
              collector left it here."""
              if pushed:
                  r = subprocess.run(["git", "-C", lv, "show", f"HEAD:crawl-runner/{p}"], capture_output=True)
                  return r.stdout if r.returncode == 0 else None
              try:
                  return open(os.path.join(lv, "crawl-runner", p), "rb").read()
              except OSError:
                  return None
          days = {}
          def row(created, rid):
              day = created[:10]
              if day not in days:
                  try:
                      days[day] = json.loads(kept(f"{day}/index.json") or b"{}").get("runs") or {}
                  except (ValueError, AttributeError):
                      days[day] = {}
              r = days[day].get(str(rid))
              return r if isinstance(r, dict) else None
          def state(created, rid, concl, attempt):
              """stored: LogView's pushed commit holds the run as it ended (its row in the day's index.json, and its logs
              zip when it has logs), so it can be deleted here. waiting: the collector could not read its logs or jobs
              yet and asks again next time (for a day after the run ended). missing: not there."""
              r = row(created, rid)
              if not pushed or r is None or (r.get("conclusion") or "unknown") != concl or str(r.get("attempt")) != attempt:
                  return "missing"
              if r.get("pending"):
                  return "waiting"
              if r.get("logs") and subprocess.run(["git", "-C", lv, "cat-file", "-e", f"HEAD:crawl-runner/{created[:10]}/{r['logs']}"],
                                                  capture_output=True).returncode != 0:
                  return "missing"
              return "stored"         # with its logs; or a run GitHub skipped, or one in which no job ran: no logs exist
          def timed_out(created, rid):
              """A cancelled run counts as a failure when a job of it hit its time limit: GitHub ends that job
              "cancelled", not "timed_out" (fec-reread's ten kills at 345 minutes, Nov 13-17, left fails_in_row at 0).
              GitHub's notes on its jobs are in the run's details, which the collector wrote beside its logs."""
              r = row(created, rid) or {}
              try:
                  d = json.loads(kept(f"{created[:10]}/{r['details']}"))
              except (KeyError, TypeError, ValueError):
                  return False
              return any("maximum execution time" in (n.get("message") or "") for n in d.get("notes") or [])
          try:
              st = json.load(open(path))
          except (OSError, ValueError):
              st = {}
          seen, count = [], {"stored": 0, "waiting": 0, "missing": 0}
          with open(delf, "w") as out:
              for line in open(rows):
                  p = line.rstrip("\n").split("\t")
                  if len(p) < 6 or not p[0].isdigit():
                      continue
                  seen.append((p[2], int(p[0]), p[1], p[3], p[4]))
                  s = state(p[2], p[0], p[3], p[5])
                  count[s] += 1
                  if s == "stored":
                      out.write(p[0] + "\n")
          # in the order the runs ended: a job's last outcome is the one that ended last
          for created, rid, name, concl, updated in sorted(seen, key=lambda x: (x[4], x[1])):
              w = st.setdefault(name, {"fails_in_row": 0, "recent": []})
              if rid in w.get("recent", []):
                  continue                      # recorded before (it waits here for its logs, for LogView, or its deletion failed)
              # more than the 100 runs of the list, so a run that stays here is not recorded twice
              w["recent"] = (w.get("recent", []) + [rid])[-200:]
              bad = concl in ("failure", "timed_out", "startup_failure") or (concl == "cancelled" and timed_out(created, rid))
              if updated < (w.get("last") or {}).get("at", ""):
                  # a run that ended before the last one recorded, recorded late (a startup_failure of days ago, a run
                  # that fell out of the list while LogView could not be reached): not the last outcome, but a failure
                  # since the last success still adds to the failures in a row, and a success to when the job last succeeded
                  if bad and updated > (w.get("last_success") or {}).get("at", ""):
                      w["fails_in_row"] = w.get("fails_in_row", 0) + 1
                  elif concl == "success" and updated > (w.get("last_success") or {}).get("at", ""):
                      w["last_success"] = {"id": rid, "at": updated}
                  continue
              w["last"] = {"id": rid, "started": created, "at": updated, "conclusion": concl}
              if concl == "success":
                  w["last_success"] = {"id": rid, "at": updated}
                  w["fails_in_row"] = 0
              elif bad:
                  w["fails_in_row"] = w.get("fails_in_row", 0) + 1
                  if concl == "cancelled":
                      w["last"]["conclusion"] = "cancelled (time limit)"
          if seen:
              os.makedirs(os.path.dirname(path), exist_ok=True)
              json.dump(st, open(path, "w"), indent=1, sort_keys=True)
          if pushed:
              print(f"{len(seen)} finished run(s) here: {count['stored']} stored in LogView, {count['waiting']} waiting for their logs, "
                    f"{count['missing']} not stored")
              if count["missing"]:
                  open(delf + ".missing", "w").write(str(count["missing"]))
          else:
              print(f"{len(seen)} finished run(s) here: none deleted (LogView was not written)")
          PY
          # only now that LogView's pushed commit holds them: delete those runs (logs and attachments) from this public repository
          for id in $(cat "$del"); do gh api -X DELETE "repos/${GITHUB_REPOSITORY}/actions/runs/$id" >/dev/null && echo "removed run $id"; done
          [ "$stored" = yes ] || exit 1          # said above; the runs stay here and are tried again at the next sync
          if [ -e "$del.missing" ]; then
            echo "::error title=Run logs::$(cat "$del.missing") finished run(s) are not in LogView after its collector ran, and stay here (is LogView's tools/collect.py the one that reads Crawl-runner's own runs?)"
            exit 1
          fi
      - name: Move the old log archive (the private repository's logs/runner) into LogView, once
        # Until late November 2026 the step above kept the logs in the private Crawl repository (logs/runner/<YYYY-MM>/:
        # 457 files, 28 MB on Nov 19). LogView's tools/move_runner_archive.py puts each of them where the collector
        # puts a run (crawl-runner/<day>/) and writes the digests again; once that is pushed and checked (every log
        # of the archive in LogView's last commit, byte for byte), logs/runner is removed from Crawl (its history
        # still holds the files). With no logs/runner left this step does nothing: it can be deleted from this file then.
        timeout-minutes: 8
        env:
          LOGVIEW_WRITE: ${{ secrets.LOGVIEW_WRITE }}
        run: |
          set -uo pipefail
          if ! GH_TOKEN="$DATA_TOKEN" gh api "repos/ClockworkBlack/Crawl/contents/logs/runner" --jq 'length' >/dev/null 2>&1; then
            echo "no logs/runner in the private repository (moved before, or not readable just now): nothing to move"; exit 0
          fi
          OLD="$RUNNER_TEMP/old-logs"; LV="$RUNNER_TEMP/logview-move"; OUT="$RUNNER_TEMP/move.out"
          trap 'rm -rf "$OLD" "$LV" "$OUT"' EXIT
          git clone -q --depth 1 --filter=blob:none --sparse "https://x-access-token:${DATA_TOKEN}@github.com/ClockworkBlack/Crawl.git" "$OLD" 2>/dev/null \
            && git -C "$OLD" sparse-checkout set --no-cone /logs/runner/ \
            || { echo "::error title=Old archive::could not read the private repository's logs/runner: nothing moved"; exit 1; }
          [ -d "$OLD/logs/runner" ] || { echo "no logs/runner in the private repository: nothing to move"; exit 0; }
          git clone -q --depth 1 --filter=blob:none --sparse "https://x-access-token:${LOGVIEW_WRITE}@github.com/ClockworkBlack/LogView.git" "$LV" 2>/dev/null \
            || { echo "::error title=Old archive::could not read LogView with LOGVIEW_WRITE: nothing moved"; exit 1; }
          git -C "$LV" sparse-checkout set --no-cone /tools/ /crawl-runner/README.md '/crawl-runner/*/index.json' '/crawl-runner/*/README.md'
          [ -f "$LV/tools/move_runner_archive.py" ] || { echo "LogView has no tools/move_runner_archive.py yet: nothing moved"; exit 0; }
          cd "$LV"
          env -u DATA_TOKEN -u LOGVIEW_WRITE -u GH_TOKEN python3 -I tools/move_runner_archive.py --archive "$OLD/logs/runner" > "$OUT" 2>&1 \
            || { echo "::error title=Old archive::the archive was not moved (the mover stopped): nothing removed from the private repository"; exit 1; }
          moved=$(grep '^moved ' "$OUT" | tail -1 || true); echo "${moved:-the mover printed no count}"
          git config user.name "LogView collector"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --sparse -A crawl-runner
          if ! git diff --cached --quiet; then
            git commit -q -m "Logs: Crawl-runner's archive from Crawl's logs/runner, ${moved%% (*}"
            ok=no
            for i in 1 2 3 4 5; do
              git pull -q --rebase origin main 2>/dev/null && git push -q origin HEAD:main 2>/dev/null && { ok=yes; break; }
              git rebase --abort 2>/dev/null || true
              sleep $((i * 5))
            done
            [ "$ok" = yes ] || { echo "::error title=Old archive::could not push the archive to LogView: nothing removed from the private repository"; exit 1; }
            echo "pushed to LogView"
          fi
          # the proof, against the commit LogView now has: every log of the archive is there, the same bytes
          rc=0; env -u DATA_TOKEN -u LOGVIEW_WRITE -u GH_TOKEN python3 -I tools/move_runner_archive.py --archive "$OLD/logs/runner" --check > "$OUT" 2>&1 || rc=$?
          grep '^checked ' "$OUT" | tail -1 || true
          [ "$rc" = 0 ] || { echo "::error title=Old archive::LogView does not hold the whole archive: nothing removed from the private repository"; exit 1; }
          cd "$OLD"
          git config user.name "gacrawl-bot"; git config user.email "gacrawl-bot@users.noreply.github.com"
          git rm -rq logs/runner && git commit -qm "runner logs: moved to LogView (crawl-runner/); logs/runner removed here" \
            || { echo "::error title=Old archive::could not remove logs/runner in the copy of the private repository"; exit 1; }
          ok=no; for i in 1 2 3 4 5; do git pull --rebase --autostash -q 2>/dev/null && git push -q 2>/dev/null && { ok=yes; break; }; sleep $((i * 5)); done
          [ "$ok" = yes ] || { echo "::error title=Old archive::the archive is in LogView, but logs/runner could not be removed from the private repository (tried again at the next sync)"; exit 1; }
          echo "logs/runner removed from the private repository: its logs are in LogView's crawl-runner/"
      - name: Keep the crawl going (the next link of the chain when none is running or queued)
        # The runner's crawl runs back to back (config/backfill.json runner.continuous): each run queues the next as it
        # ends. When that hand-off is lost (a failed dispatch, a cancelled or replaced run), nothing ran until the next
        # scheduled start or the watchdog's 30-hour check: gaps of 21 and 37 hours (Nov 11-14, 2026). At each sync (about
        # hourly), with no crawl run on main running or waiting, the next link is started here. A run that failed within minutes
        # is not started again for an hour (the watchdog reports what keeps failing).
        if: ${{ !cancelled() }}
        timeout-minutes: 3
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          on=$(python3 - <<'PY'
          import datetime as dt, json, pathlib
          try:
              c = json.loads(pathlib.Path("pub/config/backfill.json").read_text())
          except (OSError, ValueError):
              print("no"); raise SystemExit
          r = c.get("runner") or {}
          until = r.get("until") if "until" in r else c.get("until")
          live = not until or dt.datetime.now() < dt.datetime.fromisoformat(until)
          print("yes" if c.get("enabled") and r.get("continuous") and live else "no")
          PY
          )
          [ "$on" = "yes" ] || { echo "the continuous crawl is off (config/backfill.json): nothing to keep going"; exit 0; }
          busy=0
          for st in in_progress queued waiting pending requested; do
            n=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/crawl.yml/runs?branch=main&status=$st&per_page=1" --jq '.total_count' 2>/dev/null || echo "?")
            [ "$n" = "?" ] && { echo "could not list crawl runs ($st): nothing started"; exit 0; }
            busy=$((busy + n))
          done
          [ "$busy" -gt 0 ] && { echo "a crawl run is going or waiting ($busy): nothing to do"; exit 0; }
          last=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/crawl.yml/runs?branch=main&status=completed&per_page=1" \
                   --jq '.workflow_runs[0] | "\(.conclusion) \(.run_started_at) \(.updated_at)"' 2>/dev/null || echo "")
          read -r concl started ended <<< "$last"
          if [ "${concl:-}" = "failure" ] && [ -n "${ended:-}" ]; then
            mins=$(( ($(date -u -d "$ended" +%s) - $(date -u -d "$started" +%s)) / 60 ))
            since=$(( ($(date -u +%s) - $(date -u -d "$ended" +%s)) / 60 ))
            if [ "$mins" -lt 20 ] && [ "$since" -lt 60 ]; then
              echo "the last crawl run failed after $mins minutes, $since minutes ago: not started again before an hour has passed"; exit 0
            fi
          fi
          gh workflow run crawl.yml -R "$GITHUB_REPOSITORY" --ref main -f job=backfill && echo "::notice title=Crawl::no crawl run was going or waiting; started the next link of the chain"
