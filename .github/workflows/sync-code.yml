name: sync-code

# Runs in the PUBLIC runner repository only (config/runner.json runner_repo), on its free minutes, every 15 minutes:
#   1. copies the crawler's code from the private repository, the code only: state/, data/, imports/, config/private/
#      (what the crawler gathered, contacts, the requester's signature, hand-downloaded ordinances) and the records-request
#      mail and ordinances workflows never
#      leave the private repository
#   2. moves every finished run's logs into the private repository (logs/runner/YYYY-MM/; a run that did not succeed
#      also its jobs and GitHub's error notes, <run>.jobs.json) and then deletes the run here, so the public repository
#      keeps no logs once they are saved. Needs DATA_TOKEN.
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  actions: write        # delete finished runs here once their logs are saved in the private repository
  checks: read          # the error notes GitHub attaches to a failed job (kept with its logs)

concurrency:
  group: sync-code
  cancel-in-progress: false

jobs:
  sync:
    if: github.repository == 'ClockworkBlack/Crawl-runner'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DATA_TOKEN: ${{ secrets.DATA_TOKEN }}
    steps:
      - name: Copy the code from the private repository
        run: |
          set -euo pipefail
          git clone -q --depth 1 "https://x-access-token:${DATA_TOKEN}@github.com/ClockworkBlack/Crawl.git" src
          git clone -q "https://x-access-token:${DATA_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" pub
          SHA=$(git -C src rev-parse --short HEAD)
          rsync -a --delete \
            --exclude .git --exclude state/ --exclude data/ --exclude imports/ --exclude config/private/ --exclude logs/ \
            --exclude .github/workflows/records-send.yml --exclude .github/workflows/records-test.yml \
            --exclude .github/workflows/probe.yml --exclude .github/workflows/ordinances.yml --exclude .github/workflows/code-finder.yml \
            --exclude outbox/ --exclude .github/workflows/mail-send.yml --exclude .github/workflows/qbe-discover.yml --exclude .github/workflows/election-reports-check.yml --exclude .github/workflows/dry-run.yml \
            src/ pub/
          # excluded paths are also never kept here (rsync --delete leaves excluded paths alone, so remove them)
          rm -rf pub/state pub/data pub/imports pub/config/private pub/logs \
                 pub/.github/workflows/records-send.yml pub/.github/workflows/records-test.yml pub/.github/workflows/probe.yml pub/.github/workflows/ordinances.yml pub/.github/workflows/code-finder.yml \
                 pub/outbox pub/.github/workflows/mail-send.yml pub/.github/workflows/qbe-discover.yml pub/.github/workflows/election-reports-check.yml pub/.github/workflows/dry-run.yml
          if grep -rIlE "Humble Servant|ORR_PASSWORD=|@gmail\.com" pub --exclude-dir=.git --exclude=sync-code.yml >/dev/null 2>&1; then
            echo "::error::private text found in the copy; nothing pushed"; grep -rIlE "Humble Servant|@gmail\.com" pub --exclude-dir=.git; exit 1
          fi
          cd pub
          git config user.name "gacrawl-bot"; git config user.email "gacrawl-bot@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            # GitHub turns a public repository's schedules off after 60 days without activity, and a quiet stretch with
            # no code change would stop every job here, the watchdog with them: an empty commit every 45 days keeps them on
            if [ $(( $(date +%s) - $(git log -1 --format=%ct) )) -gt $(( 45 * 86400 )) ]; then
              git commit -q --allow-empty -m "Keep the schedules on (no code change in 45 days)" && git push -q origin HEAD:main && echo "keep-alive commit pushed"
            fi
            echo "already in sync ($SHA)"; exit 0
          fi
          git commit -qm "Code from the private repository ($SHA)"
          git push -q origin HEAD:main
          echo "synced $SHA"
      - name: Move finished runs' logs to the private repository, then delete them here
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          git clone -q --depth 1 --filter=blob:none --sparse "https://x-access-token:${DATA_TOKEN}@github.com/ClockworkBlack/Crawl.git" logs-repo
          git -C logs-repo sparse-checkout set --no-cone /logs/runner/
          # a run that did not succeed also keeps its jobs (each step's times) and the error notes GitHub attached to each
          # failed job, next to its logs (<run>.jobs.json): a runner GitHub lost leaves no log of its own, and its note
          # ("lost communication with the server", "received a shutdown signal") would go with the run (Nov 11: ai-predict
          # bench (qwen35, 0) failed 1h53m in with neither, so nothing said why)
          JOBS="$RUNNER_TEMP/jobs.py"
          cat > "$JOBS" <<'PY'
          import json, os, sys, urllib.request
          rid, out = sys.argv[1], sys.argv[2]
          api, repo = os.environ.get("GITHUB_API_URL", "https://api.github.com"), os.environ["GITHUB_REPOSITORY"]
          def get(path):
              q = urllib.request.Request(f"{api}/{path}", headers={"Authorization": "Bearer " + os.environ["GH_TOKEN"],
                                                                   "Accept": "application/vnd.github+json"})
              with urllib.request.urlopen(q, timeout=60) as r:
                  return json.load(r)
          jobs = []
          for j in get(f"repos/{repo}/actions/runs/{rid}/jobs?per_page=100").get("jobs") or []:
              k = {x: j.get(x) for x in ("name", "conclusion", "started_at", "completed_at", "runner_name")}
              k["steps"] = [{x: s.get(x) for x in ("name", "conclusion", "started_at", "completed_at")} for s in j.get("steps") or []]
              if j.get("conclusion") not in ("success", "skipped", None):
                  try:
                      k["notes"] = [{"level": a.get("annotation_level"), "message": a.get("message")}
                                    for a in get(f"repos/{repo}/check-runs/{j['id']}/annotations?per_page=50")]
                  except Exception as e:  # noqa: BLE001  the jobs are still worth keeping
                      k["notes"] = [{"level": "unread", "message": f"{type(e).__name__}: {e}"}]
              jobs.append(k)
          json.dump({"run": int(rid), "jobs": jobs}, open(out, "w", encoding="utf-8"), indent=1)
          bad = [f"{k['name']} ({k['conclusion']})" for k in jobs if "notes" in k]
          print(f"run {rid}: {len(jobs)} jobs kept" + (f"; error notes of {', '.join(bad)}" if bad else ""))
          PY
          n=0; done_ids=""; rows=$(mktemp)
          for row in $(gh api "repos/${GITHUB_REPOSITORY}/actions/runs?status=completed&per_page=100" --jq '.workflow_runs[] | select(.id != '"${GITHUB_RUN_ID}"') | "\(.id),\(.name),\(.created_at),\(.conclusion),\(.updated_at)"'); do
            IFS=, read -r id name created concl updated <<< "$row"
            # every crawl, police and ai-predict run's logs (ai-predict: Nov 11 a whole run succeeded with no answers and
            # left nothing to say why), each News loop's (a run of over ten minutes: its passes' times and outlets; the
            # hourly check that finds a loop running is not kept), and any other job's when it failed or was cancelled
            long=0; [ "$name" = "news" ] && [ $(( $(date -d "$updated" +%s) - $(date -d "$created" +%s) )) -gt 600 ] && long=1
            if [ "$name" = "crawl" ] || [ "$name" = "police" ] || [ "$name" = "ai-predict" ] || [ "$name" = "ai-replay" ] || [ "$name" = "ai-said-by" ] || [ "$name" = "site-search" ] || [ "$name" = "ai-law-questions" ] || [ "$long" = 1 ] || [ "$concl" = "failure" ] || [ "$concl" = "timed_out" ] || [ "$concl" = "startup_failure" ] || [ "$concl" = "cancelled" ]; then
              d="logs-repo/logs/runner/${created:0:7}"; mkdir -p "$d"
              f="$d/${created:0:10}_${name}_${id}.zip"
              gh api "repos/${GITHUB_REPOSITORY}/actions/runs/$id/logs" > "$f" 2>/dev/null || { rm -f "$f"; echo "logs for $id not ready yet"; continue; }
              n=$((n+1))
              [ "$concl" = "success" ] || python3 "$JOBS" "$id" "${f%.zip}.jobs.json" || { rm -f "${f%.zip}.jobs.json"; echo "jobs of $id not kept"; }
            fi
            done_ids="$done_ids $id"
            echo "$row" >> "$rows"
          done
          # each job's last outcome and last success (runner-status.json, an asset of the private crawl-data release, so it
          # adds no commits): the watchdog reads it to find a job that keeps failing or has stopped running, which the
          # deleted runs would otherwise hide
          mkdir -p status && GH_TOKEN="$DATA_TOKEN" gh release download crawl-data -R ClockworkBlack/Crawl -p runner-status.json -D status --clobber 2>/dev/null || true
          python3 - "$rows" status/runner-status.json logs-repo/logs/runner <<'PY' && [ -s status/runner-status.json ] && { GH_TOKEN="$DATA_TOKEN" gh release upload crawl-data status/runner-status.json -R ClockworkBlack/Crawl --clobber >/dev/null && echo "run status recorded" || echo "::warning::run status not uploaded"; } || true
          import json, os, sys
          rows, path, logs = sys.argv[1], sys.argv[2], sys.argv[3]
          def timed_out(created, name, rid):
              """A cancelled run counts as a failure when a job of it hit its time limit: GitHub ends that job
              "cancelled", not "timed_out" (fec-reread's ten kills at 345 minutes, Nov 13-17, left fails_in_row at 0).
              Its error notes are in the <run>.jobs.json kept beside its logs above."""
              try:
                  d = json.load(open(os.path.join(logs, created[:7], f"{created[:10]}_{name}_{rid}.jobs.json")))
              except (OSError, ValueError):
                  return False
              return any("maximum execution time" in (n.get("message") or "")
                         for j in d.get("jobs") or [] for n in j.get("notes") or [])
          try:
              st = json.load(open(path))
          except (OSError, ValueError):
              st = {}
          seen = []
          for line in open(rows):
              p = line.strip().split(",")
              if len(p) >= 5 and p[0].isdigit():
                  seen.append((p[2], int(p[0]), p[1], p[3], p[4]))
          for created, rid, name, concl, updated in sorted(seen):
              w = st.setdefault(name, {"fails_in_row": 0, "recent": []})
              if rid in w.get("recent", []):
                  continue                      # recorded before (its deletion failed)
              w["recent"] = (w.get("recent", []) + [rid])[-20:]
              w["last"] = {"id": rid, "started": created, "at": updated, "conclusion": concl}
              if concl == "success":
                  w["last_success"] = {"id": rid, "at": updated}
                  w["fails_in_row"] = 0
              elif concl in ("failure", "timed_out", "startup_failure") or (concl == "cancelled" and timed_out(created, name, rid)):
                  w["fails_in_row"] = w.get("fails_in_row", 0) + 1
                  if concl == "cancelled":
                      w["last"]["conclusion"] = "cancelled (time limit)"
          if seen:
              os.makedirs(os.path.dirname(path), exist_ok=True)
              json.dump(st, open(path, "w"), indent=1, sort_keys=True)
          # every run, a line each, in logs/runner/<YYYY-MM>/runs-<YYYY-MM-DD>.jsonl: the runs whose logs are not kept
          # (a success of publish-site, results, fec-reread, ga-money, the AI jobs...) are deleted here all the same,
          # and LogView builds its crawl-runner folder from this archive, so without these lines it never saw them
          import datetime as dt
          def secs(a, b):
              try:
                  return int((dt.datetime.fromisoformat(b.replace("Z", "+00:00")) - dt.datetime.fromisoformat(a.replace("Z", "+00:00"))).total_seconds())
              except (AttributeError, ValueError):
                  return None
          for created, rid, name, concl, updated in sorted(seen):
              d = os.path.join(logs, created[:7])
              os.makedirs(d, exist_ok=True)
              f = os.path.join(d, f"runs-{created[:10]}.jsonl")
              have = open(f).read() if os.path.exists(f) else ""
              if f'"id": {rid},' in have:
                  continue
              zipf = f"{created[:10]}_{name}_{rid}.zip"
              row = {"id": rid, "workflow": name, "created": created, "ended": updated, "conclusion": concl,
                     "took": secs(created, updated), "logs": zipf if os.path.exists(os.path.join(d, zipf)) else None}
              open(f, "a").write(json.dumps(row) + "\n")
          PY
          # keep 30 days of runner logs in the private repository (by the date in the file name)
          CUT=$(date -u -d '30 days ago' +%Y-%m-%d)
          for f in logs-repo/logs/runner/*/*.zip logs-repo/logs/runner/*/*.jobs.json; do [ -e "$f" ] || continue; b=$(basename "$f"); [ "${b:0:10}" \< "$CUT" ] && rm -f "$f"; done
          for f in logs-repo/logs/runner/*/runs-*.jsonl; do [ -e "$f" ] || continue; b=$(basename "$f" .jsonl); [ "${b#runs-}" \< "$CUT" ] && rm -f "$f"; done
          cd logs-repo
          git config user.name "gacrawl-bot"; git config user.email "gacrawl-bot@users.noreply.github.com"
          git add -A logs/runner 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -qm "runner logs: $n run(s)"
            ok=false; for i in 1 2 3 4 5; do git pull --rebase --autostash -q && git push -q && { ok=true; break; }; sleep $((i*5)); done
            [ "$ok" = true ] || { echo "::error::could not save the logs; nothing deleted"; exit 1; }
            echo "saved $n run log(s) in the private repository"
          fi
          cd ..
          # only now that they are saved: delete those runs (logs and attachments) from this public repository
          for id in $done_ids; do gh api -X DELETE "repos/${GITHUB_REPOSITORY}/actions/runs/$id" >/dev/null && echo "removed run $id"; done
      - name: Keep the crawl going (the next link of the chain when none is running or queued)
        # The runner's crawl runs back to back (config/backfill.json runner.continuous): each run queues the next as it
        # ends. When that hand-off is lost (a failed dispatch, a cancelled or replaced run), nothing ran until the next
        # scheduled start or the watchdog's 30-hour check: gaps of 21 and 37 hours (Nov 11-14, 2026). Every 15 minutes,
        # with no crawl run on main running or waiting, the next link is started here. A run that failed within minutes
        # is not started again for an hour (the watchdog reports what keeps failing).
        if: ${{ !cancelled() }}
        timeout-minutes: 3
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          on=$(python3 - <<'PY'
          import datetime as dt, json, pathlib
          try:
              c = json.loads(pathlib.Path("pub/config/backfill.json").read_text())
          except (OSError, ValueError):
              print("no"); raise SystemExit
          r = c.get("runner") or {}
          until = r.get("until") if "until" in r else c.get("until")
          live = not until or dt.datetime.now() < dt.datetime.fromisoformat(until)
          print("yes" if c.get("enabled") and r.get("continuous") and live else "no")
          PY
          )
          [ "$on" = "yes" ] || { echo "the continuous crawl is off (config/backfill.json): nothing to keep going"; exit 0; }
          busy=0
          for st in in_progress queued waiting pending requested; do
            n=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/crawl.yml/runs?branch=main&status=$st&per_page=1" --jq '.total_count' 2>/dev/null || echo "?")
            [ "$n" = "?" ] && { echo "could not list crawl runs ($st): nothing started"; exit 0; }
            busy=$((busy + n))
          done
          [ "$busy" -gt 0 ] && { echo "a crawl run is going or waiting ($busy): nothing to do"; exit 0; }
          last=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/crawl.yml/runs?branch=main&status=completed&per_page=1" \
                   --jq '.workflow_runs[0] | "\(.conclusion) \(.run_started_at) \(.updated_at)"' 2>/dev/null || echo "")
          read -r concl started ended <<< "$last"
          if [ "${concl:-}" = "failure" ] && [ -n "${ended:-}" ]; then
            mins=$(( ($(date -u -d "$ended" +%s) - $(date -u -d "$started" +%s)) / 60 ))
            since=$(( ($(date -u +%s) - $(date -u -d "$ended" +%s)) / 60 ))
            if [ "$mins" -lt 20 ] && [ "$since" -lt 60 ]; then
              echo "the last crawl run failed after $mins minutes, $since minutes ago: not started again before an hour has passed"; exit 0
            fi
          fi
          gh workflow run crawl.yml -R "$GITHUB_REPOSITORY" --ref main -f job=backfill && echo "::notice title=Crawl::no crawl run was going or waiting; started the next link of the chain"
