name: archive-debug-apks
# One time, on this branch only: Electo's eight debug-APK build artifacts (Nov 7-9, 2026; about 12 GB, filling the
# account's Actions storage) copied to the private Crawl repository's "archive-debug-apks" release, where nothing reads
# them. Each copy is checked against the downloaded file (size and SHA-256) before the next. The originals are deleted
# afterwards, by hand, only once every copy checks out. Nothing on main, crawl-data or any other branch is touched.
on:
  workflow_dispatch:
  push:
    branches: [archive/debug-apks]
permissions:
  contents: read
jobs:
  move:
    if: github.repository == 'ClockworkBlack/Crawl-runner'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      ELECTO_TOKEN: ${{ secrets.ELECTO_TOKEN || secrets.DATA_TOKEN }}
      DATA_TOKEN: ${{ secrets.DATA_TOKEN }}
      SRC: ClockworkBlack/Electo
      DEST: ClockworkBlack/Crawl
      TAG: archive-debug-apks
    steps:
      - name: Copy each artifact to the Crawl release and check it
        run: |
          set -euo pipefail
          notes="Stored only, nothing reads these: Electo's debug APKs from the build-android runs of Nov 7-9, 2026, moved here from Electo's Actions artifacts (which they had filled). Each file: Electo-debug-<build time>-run<run id>-<commit>.apk; SHA256SUMS lists them."
          GH_TOKEN="$DATA_TOKEN" gh release view "$TAG" -R "$DEST" >/dev/null 2>&1 || GH_TOKEN="$DATA_TOKEN" gh release create "$TAG" -R "$DEST" --target main --prerelease --latest=false --title "Archived debug APKs (stored only)" --notes "$notes"
          GH_TOKEN="$DATA_TOKEN" gh release edit "$TAG" -R "$DEST" --notes "$notes" >/dev/null
          # step 2 of 2: from Electo's temporary hand-off release (its archive-debug-apks job staged and checked them)
          GH_TOKEN="$ELECTO_TOKEN" gh api "repos/$SRC/releases/tags/debug-apks-transfer" --jq '.assets[] | select(.name | endswith(".apk")) | "\(.id) \(.name) \(.size) \(.digest)"' > staged.txt
          [ "$(wc -l < staged.txt)" -eq 8 ] || { echo "::error::$(wc -l < staged.txt) of 8 staged on Electo"; exit 1; }
          : > SHA256SUMS
          while read -r aid name size digest; do
            GH_TOKEN="$ELECTO_TOKEN" gh api -H "Accept: application/octet-stream" "repos/$SRC/releases/assets/$aid" > "$name"
            sum=$(sha256sum "$name" | cut -d' ' -f1)
            [ "$(stat -c %s "$name") sha256:$sum" = "$size $digest" ] || { echo "::error::$name: download differs from Electo's staged copy"; exit 1; }
            GH_TOKEN="$DATA_TOKEN" gh release upload "$TAG" -R "$DEST" "$name" --clobber
            got=$(GH_TOKEN="$DATA_TOKEN" gh api "repos/$DEST/releases/tags/$TAG" --jq ".assets[] | select(.name==\"$name\") | \"\(.size) \(.digest)\"")
            [ "$got" = "$size $digest" ] || { echo "::error::$name: Crawl has '$got', expected '$size $digest'"; exit 1; }
            echo "$sum  $name" >> SHA256SUMS; echo "copied and checked: $name ($size bytes)"; rm -f "$name"
          done < staged.txt
          GH_TOKEN="$DATA_TOKEN" gh release upload "$TAG" -R "$DEST" SHA256SUMS --clobber
          echo "all 8 copied and checked" | tee -a "$GITHUB_STEP_SUMMARY"
