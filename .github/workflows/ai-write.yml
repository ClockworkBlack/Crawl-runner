name: ai-write
# Profiles written from the records, for everyone on a Georgia ballot since 2016 (Electo ga/written.py: background from
# their races and the legislature's records, positions from their own words, the governor's signed and vetoed acts).
# Here the open model (Electo tools/ai/profile_write.py: Qwen3-8B, 4-bit, on the runner's CPU) joins a topic's several
# checked lines (ai-profiles' work) into one sentence per topic, kept only when the checker finds nothing in it the lines
# and the person's own words do not give. Two runners share the people (by hash); a topic is written again only when its
# lines change. Then the sentences are combined into Electo's ga/crawl/write_ai.json (every call kept in
# research/train/profile_write_log.jsonl), the written profiles are folded into the profiles on Electo's newest main
# (tools/written_publish.sh) and the public site is refreshed. Runs after ai-profiles (01:37 and 13:37 UTC).
on:
  schedule:
    - cron: "47 7,19 * * *"
  workflow_dispatch:
    inputs:
      minutes:
        description: "minutes of model time per runner"
        default: "240"

permissions:
  contents: read
  actions: write        # remove this run's attachments at the end

concurrency:
  group: ai-write-${{ github.ref_name }}
  cancel-in-progress: false

env:
  PYTHONUNBUFFERED: "1"
  ELECTO_LLM_JOB: profile_write      # the model Electo's tools/ai/models.json gives this job (Qwen3-8B on Nov 12)
  IS_MAIN: ${{ github.ref_name == github.event.repository.default_branch }}

jobs:
  write:
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1]
    steps:
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Electo (the people's checked lines, the prompts and the checker)
        env:
          ELECTO_TOKEN: ${{ secrets.ELECTO_TOKEN || secrets.DATA_TOKEN }}
          ELECTO_REPO: ${{ vars.ELECTO_REPO || 'ClockworkBlack/Electo' }}
        run: |
          git clone -q --depth 1 --filter=blob:none --sparse "https://x-access-token:${ELECTO_TOKEN}@github.com/${ELECTO_REPO}.git" electo
          cd electo && git sparse-checkout set --no-cone /tools/ai/ /ga/written.py /ga/names.py /ga/crawl/people.json \
            /ga/crawl/profile_ai.json /ga/crawl/write_ai.json /ga/pipeline_archive/people.json /ga/pipeline_archive/aliases.json \
            /ga/pipeline_archive/splits.json /ga/pipeline_archive/extra.json /ga/pipeline_archive/crawl_elections.json
          git remote set-url origin "https://github.com/${ELECTO_REPO}.git"     # no credential left in the checkout
      - name: Which open model does this job (Electo tools/ai/models.json)
        id: which
        run: cd electo && python3 -I tools/ai/llm.py --which profile_write | tee -a "$GITHUB_OUTPUT"
      - name: The open model (4-bit; kept between runs)
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: ${{ steps.which.outputs.key || 'hf-qwen3-8b-q4km-v1' }}
      - name: llama.cpp (CPU build)
        run: pip install -q --prefer-binary "llama-cpp-python>=0.3.36" numpy huggingface_hub --extra-index-url https://abetlen.github.io/llama-cpp-python/whl/cpu
      - name: Write this runner's share of the topics
        run: |
          M="${{ inputs.minutes || '240' }}"
          cd electo && python3 -I tools/ai/profile_write.py --list
          timeout -s INT -k 2m "$((M + 10))m" python3 -I tools/ai/profile_write.py --shard ${{ matrix.shard }} --of 2 --minutes "$M" --out ../shard.json || echo "stopped"
          [ -f ../shard.json ] || echo '{"v":1,"p":{}}' > ../shard.json
          cp research/train/profile_write_log.jsonl ../log.jsonl 2>/dev/null || : > ../log.jsonl
      - uses: actions/upload-artifact@v4
        with:
          name: profile-write-${{ matrix.shard }}
          path: |
            shard.json
            log.jsonl
          retention-days: 2

  combine:
    needs: write
    if: always() && github.event.repository.private == false && needs.write.result != 'skipped'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - uses: actions/download-artifact@v4
        with: {pattern: "profile-write-*", path: shards}
      - name: Combine into Electo, fold the written profiles in, refresh the public site
        if: env.IS_MAIN == 'true'
        env:
          ELECTO_TOKEN: ${{ secrets.ELECTO_TOKEN || secrets.DATA_TOKEN }}
          ELECTO_REPO: ${{ vars.ELECTO_REPO || 'ClockworkBlack/Electo' }}
          SITE_TOKEN: ${{ secrets.SITE_DATA_TOKEN || secrets.ELECTO_TOKEN }}
          SITE_DATA_REPO: ${{ vars.SITE_DATA_REPO || 'ClockworkBlack/electo-data' }}
        run: |
          set -e
          S="$PWD/shards"
          git clone -q --depth 1 "https://x-access-token:${ELECTO_TOKEN}@github.com/${ELECTO_REPO}.git" /tmp/electo-ai
          cd /tmp/electo-ai
          git config user.name "gacrawl-bot" && git config user.email "gacrawl-bot@users.noreply.github.com"
          # the sentences and their log: only this job writes them; each try starts from Electo's newest main
          for i in 1 2 3 4 5; do
            git fetch -q --depth 1 origin main && git reset -q --hard FETCH_HEAD
            # the log first: the combine reads it to give a sentence the checker turned down another look under its
            # current rules (no model needed)
            mkdir -p research/train && touch research/train/profile_write_log.jsonl
            cat "$S"/*/log.jsonl >> research/train/profile_write_log.jsonl 2>/dev/null || true
            python3 -I -c "import sys; p=sys.argv[1]; L=[l for l in open(p, encoding='utf-8') if l.strip()]; seen=set(); out=[]
          for l in L:
              if l not in seen: seen.add(l); out.append(l)
          open(p, 'w', encoding='utf-8').writelines(out[-20000:])" research/train/profile_write_log.jsonl
            python3 -I tools/ai/profile_write.py --combine "$S"/*/shard.json
            git add ga/crawl/write_ai.json research/train/profile_write_log.jsonl
            if git diff --cached --quiet; then echo "no new sentences"; break; fi
            git commit -qm "Profile topics written by the open model: $(date -u +%Y-%m-%dT%H:%MZ)"
            git push -q origin HEAD:main && break
            [ "$i" -lt 5 ] || { echo "::error::the topic sentences could not be pushed to Electo"; exit 1; }
            sleep $((i * 10))
          done
          bash tools/written_publish.sh
          [ -f tools/site_data.sh ] && GH_TOKEN="$SITE_TOKEN" timeout 25m bash tools/site_data.sh || echo "site data not refreshed"
      - name: Remove this run's attachments
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for id in $(gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts" --jq '.artifacts[].id'); do
            gh api -X DELETE "repos/${{ github.repository }}/actions/artifacts/$id" && echo "removed attachment $id"
          done
