name: ai-outlook
# The Outlook cards at the top of the Electo page, kept current by the open model (Electo tools/ai/outlook_ai.py:
# Qwen3-8B, 4-bit, on the runner's CPU) instead of anyone's AI: the site is built, opened headless, and the model is
# given the exact prompt the page would give Claude; the checker keeps cards whose figures are all in that prompt and
# that cite its sources. A new set is written when the data changed or the last is 20 hours old (otherwise this run
# ends after the check), committed to Electo's ga/outlook.json, and the public site is refreshed.
on:
  schedule:
    - cron: "23 */6 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "write a new set even if the data has not changed"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ai-outlook-${{ github.ref_name }}
  cancel-in-progress: false

env:
  PYTHONUNBUFFERED: "1"
  IS_MAIN: ${{ github.ref_name == github.event.repository.default_branch }}

jobs:
  outlook:
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Electo
        env:
          ELECTO_TOKEN: ${{ secrets.ELECTO_TOKEN || secrets.DATA_TOKEN }}
          ELECTO_REPO: ${{ vars.ELECTO_REPO || 'ClockworkBlack/Electo' }}
        run: git clone -q --depth 1 "https://x-access-token:${ELECTO_TOKEN}@github.com/${ELECTO_REPO}.git" /tmp/electo-ol
      - name: Build and serve the site
        run: |
          cd /tmp/electo-ol && bash qa/mksite.sh | tail -1
          (cd qa/site && nohup python3 -m http.server 8765 --bind 127.0.0.1 >/dev/null 2>&1 &)
          sleep 2
      - name: The open model (Qwen3-8B, 4-bit; shared with ai-profiles)
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-qwen3-8b-q4km-v1
      - name: Playwright and llama.cpp (CPU build)
        run: |
          pip install -q --prefer-binary playwright "llama-cpp-python>=0.3.9" huggingface_hub --extra-index-url https://abetlen.github.io/llama-cpp-python/whl/cpu
          python -m playwright install --with-deps chromium >/dev/null
      - name: Write the outlook
        run: cd /tmp/electo-ol && python3 -I tools/ai/outlook_ai.py http://127.0.0.1:8765/ ${{ inputs.force && '--force' || '' }}
      - name: Commit to Electo and refresh the public site
        if: env.IS_MAIN == 'true'
        env:
          SITE_TOKEN: ${{ secrets.SITE_DATA_TOKEN || secrets.ELECTO_TOKEN }}
          SITE_DATA_REPO: ${{ vars.SITE_DATA_REPO || 'ClockworkBlack/electo-data' }}
          ELECTO_REPO: ${{ vars.ELECTO_REPO || 'ClockworkBlack/Electo' }}
        run: |
          cd /tmp/electo-ol
          git config user.name "gacrawl-bot" && git config user.email "gacrawl-bot@users.noreply.github.com"
          git add ga/outlook.json research/train/outlook_ai_log.jsonl 2>/dev/null || true
          if git diff --cached --quiet; then echo "no new outlook"; exit 0; fi
          git commit -qm "Outlook by the open model: $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3 4 5; do git pull --rebase --autostash -q && git push -q && break; sleep $((i*5)); done
          [ -f tools/site_data.sh ] && GH_TOKEN="$SITE_TOKEN" timeout 25m bash tools/site_data.sh || echo "site data not refreshed"
