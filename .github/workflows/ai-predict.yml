name: ai-predict
# How good the open models' predictions are, measured against what happened, and the results fed back to them
# (Electo tools/predict/):
#   bench    hidden votes: a legislator's later landmark vote is predicted from their earlier record, by each open model,
#            with and without the facts counted for it (party-line record, closest earlier votes, who carries the bill),
#            and scored against the vote cast, next to plain rules on the same questions (research/predict/vote_bench.json)
#   check    predictions made earlier are checked against what the person later did or said (votes, signatures,
#            statements the crawl brought), and predictions made as of an earlier date are checked against the years
#            since, by the open model as judge (tools/predict/ledger.py); right and wrong ones go into the ledger
#   combine  the ledger, the track record the page shows, the notes the inference job reads back (how often each kind of
#            inference held, examples that did and did not), and fine-tuning examples (research/train/predict/)
# Runs daily (check and combine); the hidden-vote test only when asked for (bench = questions per model and variant).
# A part whose runner GitHub lost sends nothing (Nov 11: bench (qwen35, 0) died 1h53m in, with no log and no answers);
# the combine names it, and `parts` runs just that part again (sync-code deletes a finished run within 15 minutes, so
# "Re-run failed jobs" is gone by then). The combine adds a re-run's answers to the ones on file, by question.
on:
  schedule:
    - cron: "41 4 * * *"
  workflow_dispatch:
    inputs:
      bench:
        description: "run the hidden-vote test (questions per model, split over 4 runners; 400 is the standard set; 0 = skip)"
        default: "0"
      minutes:
        description: "minutes of model time per runner"
        default: "240"
      models:
        description: 'models for the hidden-vote test, a JSON list: phi4, qwen3, gemma4 (Gemma 4 12B), qwen35 (Qwen3.5-9B), tuned (the repo below)'
        default: '["phi4","gemma4","qwen35"]'
      parts:
        description: 'which of the 4 parts to run, a JSON list: all four [0,1,2,3], or only the ones a lost runner left out (e.g. [0])'
        default: '[0,1,2,3]'
      tuned:
        description: "a fine-tuned model's Hugging Face repo (e.g. name/electo-predict-gemma4-12b); add \"tuned\" to models to score it"
        default: ""
      tuned_quant:
        description: "its 4-bit kind (the part of the .gguf file name)"
        default: "Q4_K_M"

permissions:
  contents: read
  actions: write        # remove this run's attachments at the end

# the hidden-vote test and the daily check never wait on each other (each pushes with a fetch-and-retry loop)
concurrency:
  group: ai-predict-${{ github.ref_name }}-${{ (inputs.bench != '' && inputs.bench != '0') && 'bench' || 'check' }}
  cancel-in-progress: false

env:
  PYTHONUNBUFFERED: "1"
  IS_MAIN: ${{ github.ref_name == github.event.repository.default_branch }}

jobs:
  bench:
    if: github.event.repository.private == false && inputs.bench != '' && inputs.bench != '0'
    runs-on: ubuntu-latest
    timeout-minutes: 320
    strategy:
      fail-fast: false
      matrix:
        model: ${{ fromJSON(inputs.models || '["phi4","gemma4","qwen35"]') }}
        # with the counted facts only (Nov 11: they helped both models in both runs); 400 questions in 4 parts (all four
        # unless `parts` names some: the questions of each part are the same in every run)
        shard: ${{ fromJSON(inputs.parts || '[0,1,2,3]') }}
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}         # only needed for a private repo
    steps:
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Which model
        id: which
        run: |
          # every candidate fits the runner's 16 GB as a 4-bit file (Nov 11, 2026: Gemma 4 12B 7.1 GB, Qwen3.5-9B 5.7 GB,
          # Phi-4 8.4 GB); all Apache-2.0 or MIT. Phi-4 and Qwen3-8B keep the cache keys the other workflows use.
          case "${{ matrix.model }}" in
            phi4)   R=microsoft/phi-4-gguf;          Q=Q4_K_S; N="Phi-4";       K=hf-phi4-q4ks-v1 ;;
            qwen3)  R=Qwen/Qwen3-8B-GGUF;            Q=Q4_K_M; N="Qwen3-8B";    K=hf-qwen3-8b-q4km-v1 ;;
            gemma4) R=unsloth/gemma-4-12b-it-GGUF;   Q=Q4_K_M; N="Gemma 4 12B"; K=hf-gemma4-12b-q4km-v1 ;;
            qwen35) R=unsloth/Qwen3.5-9B-GGUF;       Q=Q4_K_M; N="Qwen3.5-9B";  K=hf-qwen35-9b-q4km-v1 ;;
            tuned)  R="${{ inputs.tuned }}"; Q="${{ inputs.tuned_quant }}"; N="tuned ${{ inputs.tuned }}"; K="hf-tuned-$R-$Q"
                    [ -n "$R" ] || { echo "::error::models has \"tuned\" but no tuned repo was given"; exit 1; } ;;
            *)      echo "::error::unknown model ${{ matrix.model }}"; exit 1 ;;
          esac
          { echo "ELECTO_LLM_REPO=$R"; echo "ELECTO_LLM_QUANT=$Q"; echo "ELECTO_LLM_NAME=$N"; } >> "$GITHUB_ENV"
          echo "key=$K" >> "$GITHUB_OUTPUT"
      - name: Electo (the roll calls and the test)
        env:
          ELECTO_TOKEN: ${{ secrets.ELECTO_TOKEN || secrets.DATA_TOKEN }}
          ELECTO_REPO: ${{ vars.ELECTO_REPO || 'ClockworkBlack/Electo' }}
        run: |
          git clone -q --depth 1 --filter=blob:none --sparse "https://x-access-token:${ELECTO_TOKEN}@github.com/${ELECTO_REPO}.git" electo
          cd electo && git sparse-checkout set --no-cone /tools/ai/ /tools/predict/ /ga/pipeline_archive/legis.json /ga/pipeline_civics/acts.json /ga/pipeline_civics/legislature.json
          git remote set-url origin "https://github.com/${ELECTO_REPO}.git"
      - name: The open model (kept between runs when the cache has room)
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: ${{ steps.which.outputs.key }}
      - name: llama.cpp (CPU build; 0.3.36 or later knows Gemma 4 and Qwen3.5)
        run: pip install -q --prefer-binary "llama-cpp-python>=0.3.36" numpy huggingface_hub --extra-index-url https://abetlen.github.io/llama-cpp-python/whl/cpu
      - name: Predict the hidden votes
        run: |
          M="${{ inputs.minutes || '240' }}"; N="${{ inputs.bench || '120' }}"
          cd electo && timeout -s INT -k 2m "$((M + 10))m" python3 -I tools/predict/vote_bench.py --n "$N" --minutes "$M" \
            --shard ${{ matrix.shard }} --of 4 --out ../run.json || echo "stopped"
          [ -f ../run.json ] || echo '{"rows":[]}' > ../run.json
          cp research/train/vote_bench_log.jsonl ../log.jsonl 2>/dev/null || : > ../log.jsonl
      - name: Did it answer?
        # a part with no answers fails the job, so the run's log is kept (a finished run that succeeds is deleted with its
        # log; Nov 11 a whole three-model run came back empty and left nothing to say why)
        run: |
          python3 -c "import json,sys; r=json.load(open('run.json')).get('rows') or []; print(len(r), 'answers,', sum(1 for x in r if x.get('p') is not None), 'readable,', sum(1 for x in r if x.get('pn') is not None), 'with a probability'); sys.exit(0 if r else 1)" \
            || { echo "::error::no answers from ${{ matrix.model }} (part ${{ matrix.shard }}): see the step above"; exit 1; }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: predict-bench-${{ matrix.model }}-${{ matrix.shard }}
          path: |
            run.json
            log.jsonl
          retention-days: 2

  check:
    if: github.event.repository.private == false && (inputs.bench == '' || inputs.bench == '0')
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    env:
      ELECTO_LLM_REPO: microsoft/phi-4-gguf       # the model that writes the page's inferences
      ELECTO_LLM_QUANT: Q4_K_S
      ELECTO_LLM_NAME: Phi-4
    steps:
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Electo (the records, the page's inferences and the ledger)
        env:
          ELECTO_TOKEN: ${{ secrets.ELECTO_TOKEN || secrets.DATA_TOKEN }}
          ELECTO_REPO: ${{ vars.ELECTO_REPO || 'ClockworkBlack/Electo' }}
        run: |
          git clone -q --depth 1 --filter=blob:none --sparse "https://x-access-token:${ELECTO_TOKEN}@github.com/${ELECTO_REPO}.git" electo
          cd electo && git sparse-checkout set --no-cone /tools/ai/ /tools/predict/ /ga/profiles.json /ga/profiles_local.json \
            /ga/pipeline_archive/profiles.json /ga/pipeline_archive/legis.json /ga/crawl/infer_ai.json /ga/crawl/people.json \
            /ga/crawl/predict.json /research/predict/
          git remote set-url origin "https://github.com/${ELECTO_REPO}.git"
      - name: Anything to write or check? (with nothing for this runner, the model is neither fetched nor installed)
        id: need
        run: |
          cd electo
          N=$(python3 -I tools/predict/ledger.py --todo --shard ${{ matrix.shard }} --of 4 2>/dev/null | sed -n 's/^TODO=//p' || true)
          echo "model jobs waiting: ${N:-not known: the model is fetched}"
          if [ "$N" = "0" ]; then echo "go=false" >> "$GITHUB_OUTPUT"; else echo "go=true" >> "$GITHUB_OUTPUT"; fi
      - name: The open model (kept between runs when the cache has room)
        if: steps.need.outputs.go == 'true'
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-phi4-q4ks-v1
      - name: llama.cpp (CPU build)
        if: steps.need.outputs.go == 'true'
        run: pip install -q --prefer-binary "llama-cpp-python>=0.3.9" huggingface_hub --extra-index-url https://abetlen.github.io/llama-cpp-python/whl/cpu
      - name: Check earlier predictions against what happened since
        run: |
          M="${{ inputs.minutes || '240' }}"; [ "$M" -le 300 ] || M=300
          cd electo
          if [ ! -f tools/predict/ledger.py ] || [ "${{ steps.need.outputs.go }}" != "true" ]; then
            echo "nothing for this runner"; echo '{"entries":[]}' > ../part.json; : > ../log.jsonl; exit 0
          fi
          timeout -s INT -k 2m "$((M + 10))m" python3 -I tools/predict/ledger.py --run --shard ${{ matrix.shard }} --of 4 --minutes "$M" --out ../part.json || echo "stopped"
          [ -f ../part.json ] || echo '{"entries":[]}' > ../part.json
          cp research/train/predict_log.jsonl ../log.jsonl 2>/dev/null || : > ../log.jsonl
      - uses: actions/upload-artifact@v4
        with:
          name: predict-check-${{ matrix.shard }}
          path: |
            part.json
            log.jsonl
          retention-days: 2

  combine:
    needs: [bench, check]
    if: always() && github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - uses: actions/download-artifact@v4
        with: {pattern: "predict-*", path: parts}
        continue-on-error: true
      - name: Parts that sent nothing (named, with the inputs that run only them again)
        if: inputs.bench != '' && inputs.bench != '0'
        env:
          MODELS: ${{ inputs.models || '["phi4","gemma4","qwen35"]' }}
          PARTS: ${{ inputs.parts || '[0,1,2,3]' }}
          BENCH: ${{ inputs.bench }}
          MINUTES: ${{ inputs.minutes || '240' }}
        run: |
          python3 - <<'PY'
          import json, os
          gone = {}
          for m in json.loads(os.environ["MODELS"]):
              for p in json.loads(os.environ["PARTS"]):
                  f = f"parts/predict-bench-{m}-{p}/run.json"
                  try:
                      rows = (json.load(open(f)).get("rows") or []) if os.path.exists(f) else None
                  except ValueError:
                      rows = []
                  if rows is None:      # the upload runs even after a failed step: only a lost runner skips it
                      print(f"::warning::{m} part {p} sent nothing: GitHub lost its runner before the end (no log either)")
                  elif not rows:
                      print(f"::warning::{m} part {p} sent no answers (its job's log says why)")
                  else:
                      continue
                  gone.setdefault(m, []).append(p)
          for m, ps in gone.items():
              print(f'::warning::to run only those again: ai-predict with bench={os.environ["BENCH"]}, minutes={os.environ["MINUTES"]}, '
                    f'models=["{m}"], parts={json.dumps(ps)} (the combine adds them to the answers on file)')
          print("every part sent its answers" if not gone else f"parts missing: {gone}")
          PY
      - name: Combine into Electo and refresh the public site
        if: env.IS_MAIN == 'true'
        env:
          ELECTO_TOKEN: ${{ secrets.ELECTO_TOKEN || secrets.DATA_TOKEN }}
          ELECTO_REPO: ${{ vars.ELECTO_REPO || 'ClockworkBlack/Electo' }}
          SITE_TOKEN: ${{ secrets.SITE_DATA_TOKEN || secrets.ELECTO_TOKEN }}
          SITE_DATA_REPO: ${{ vars.SITE_DATA_REPO || 'ClockworkBlack/electo-data' }}
        run: |
          set -e
          S="$PWD/parts"; mkdir -p "$S"
          git clone -q --depth 1 "https://x-access-token:${ELECTO_TOKEN}@github.com/${ELECTO_REPO}.git" /tmp/electo-ai
          cd /tmp/electo-ai
          git config user.name "gacrawl-bot" && git config user.email "gacrawl-bot@users.noreply.github.com"
          RC=0
          for i in 1 2 3 4 5; do
            git fetch -q --depth 1 origin main && git reset -q --hard FETCH_HEAD
            RC=0; bash tools/predict/combine.sh "$S" || RC=$?
            git add -A research/predict research/train/predict ga/crawl/predict.json ga/pipeline_civics/bill_odds.json 2>/dev/null || true
            if git diff --cached --quiet; then echo "nothing new"; break; fi
            git commit -qm "Predictions checked against what happened: $(date -u +%Y-%m-%dT%H:%MZ)"
            git push -q origin HEAD:main && break
            [ "$i" -lt 5 ] || { echo "::error::the prediction results could not be pushed to Electo"; exit 1; }
            sleep $((i * 10))
          done
          [ -f tools/site_data.sh ] && GH_TOKEN="$SITE_TOKEN" timeout 25m bash tools/site_data.sh || echo "site data not refreshed"
          # what could be combined is kept either way; a disagreement among the inputs still fails the run, so it is seen
          [ "$RC" = 0 ] || { echo "::error::tools/predict/combine.sh ended with $RC (see its lines above)"; exit "$RC"; }
      - name: Remove this run's attachments
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for id in $(gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts" --jq '.artifacts[].id'); do
            gh api -X DELETE "repos/${{ github.repository }}/actions/artifacts/$id" && echo "removed attachment $id"
          done
