name: ai-infer
# What each candidate may support next, for every profile, by a second open model (Electo tools/ai/infer_ai.py:
# Microsoft Phi-4, 14B, 4-bit Q4_K_S, on the runner's CPU; Qwen3-8B keeps the sorting and news). Each person's sourced
# record goes to the model, which returns inferences with their basis and source IDs; a checker keeps only those whose
# basis is in the record and whose sources are real. Six runners share the people (by hash), each for up to five
# hours; a person is read again only when their record changes, so the runs pick up where the last stopped. Then the
# results are combined into Electo's ga/crawl/infer_ai.json (every call kept in research/train/infer_ai_log.jsonl)
# and the public site is refreshed.
on:
  schedule:
    # every 6 hours: each run is up to five hours on six runners, so the runners read nearly around the clock (it was
    # twice a day, and 6,500 people were still unread on Nov. 9); a run with nothing to read ends in a minute or two
    - cron: "11 1,7,13,19 * * *"
  workflow_dispatch:
    inputs:
      minutes:
        description: "minutes of model time per runner"
        default: "300"

permissions:
  contents: read
  actions: write        # remove this run's attachments at the end

concurrency:
  group: ai-infer-${{ github.ref_name }}
  cancel-in-progress: false

env:
  PYTHONUNBUFFERED: "1"
  IS_MAIN: ${{ github.ref_name == github.event.repository.default_branch }}
  ELECTO_LLM_REPO: microsoft/phi-4-gguf
  ELECTO_LLM_QUANT: Q4_K_S
  ELECTO_LLM_NAME: Phi-4

jobs:
  infer:
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 340
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5]
    steps:
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Electo (the profiles and the tool)
        env:
          ELECTO_TOKEN: ${{ secrets.ELECTO_TOKEN || secrets.DATA_TOKEN }}
          ELECTO_REPO: ${{ vars.ELECTO_REPO || 'ClockworkBlack/Electo' }}
        run: |
          git clone -q --depth 1 --filter=blob:none --sparse "https://x-access-token:${ELECTO_TOKEN}@github.com/${ELECTO_REPO}.git" electo
          cd electo && git sparse-checkout set --no-cone /tools/ai/ /ga/profiles.json /ga/profiles_local.json /ga/pipeline_archive/profiles.json /ga/pipeline_archive/legis.json /ga/crawl/infer_ai.json
          git remote set-url origin "https://github.com/${ELECTO_REPO}.git"     # no credential left in the checkout
      - name: Anything to read? (with nothing for this runner, the model is neither fetched nor installed)
        id: need
        run: |
          cd electo
          N=$(python3 -I tools/ai/infer_ai.py --list --shard ${{ matrix.shard }} --of 6 2>/dev/null | sed -n 's/^TODO=//p' || true)
          echo "to read: ${N:-not known (an older tool): the model is fetched as before}"
          if [ "$N" = "0" ]; then echo "go=false" >> "$GITHUB_OUTPUT"; else echo "go=true" >> "$GITHUB_OUTPUT"; fi
      - name: The open model (Phi-4, 4-bit; kept between runs when the cache has room)
        if: steps.need.outputs.go == 'true'
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-phi4-q4ks-v1
      - name: llama.cpp (CPU build)
        if: steps.need.outputs.go == 'true'
        run: pip install -q --prefer-binary "llama-cpp-python>=0.3.9" huggingface_hub --extra-index-url https://abetlen.github.io/llama-cpp-python/whl/cpu
      - name: Infer for this runner's share of the people
        run: |
          M="${{ inputs.minutes || '300' }}"
          cd electo && timeout -s INT -k 2m "$((M + 10))m" python3 -I tools/ai/infer_ai.py --shard ${{ matrix.shard }} --of 6 --minutes "$M" --out ../shard.json || echo "stopped"
          [ -f ../shard.json ] || echo '{"v":1,"p":{}}' > ../shard.json
          cp research/train/infer_ai_log.jsonl ../log.jsonl 2>/dev/null || : > ../log.jsonl
      - uses: actions/upload-artifact@v4
        with:
          name: infer-ai-${{ matrix.shard }}
          path: |
            shard.json
            log.jsonl
          retention-days: 2

  combine:
    needs: infer
    if: always() && github.event.repository.private == false && needs.infer.result != 'skipped'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - uses: actions/download-artifact@v4
        with: {pattern: "infer-ai-*", path: shards}
      - name: Combine into Electo and refresh the public site
        if: env.IS_MAIN == 'true'
        env:
          ELECTO_TOKEN: ${{ secrets.ELECTO_TOKEN || secrets.DATA_TOKEN }}
          ELECTO_REPO: ${{ vars.ELECTO_REPO || 'ClockworkBlack/Electo' }}
          SITE_TOKEN: ${{ secrets.SITE_DATA_TOKEN || secrets.ELECTO_TOKEN }}
          SITE_DATA_REPO: ${{ vars.SITE_DATA_REPO || 'ClockworkBlack/electo-data' }}
        run: |
          set -e
          S="$PWD/shards"
          git clone -q --depth 1 "https://x-access-token:${ELECTO_TOKEN}@github.com/${ELECTO_REPO}.git" /tmp/electo-ai
          cd /tmp/electo-ai
          python3 -I tools/ai/infer_ai.py --combine "$S"/*/shard.json
          mkdir -p research/train && touch research/train/infer_ai_log.jsonl
          cat "$S"/*/log.jsonl >> research/train/infer_ai_log.jsonl 2>/dev/null || true
          python3 -I -c "import sys; p=sys.argv[1]; L=[l for l in open(p, encoding='utf-8') if l.strip()]; seen=set(); out=[]
          for l in L:
              if l not in seen: seen.add(l); out.append(l)
          out=out[-20000:]; i=len(out); size=0      # and under 80 MB: GitHub refuses a file over 100 MB, and the push with it
          while i and size+len(out[i-1].encode('utf-8'))<=80000000: i-=1; size+=len(out[i].encode('utf-8'))
          open(p, 'w', encoding='utf-8').writelines(out[i:])" research/train/infer_ai_log.jsonl
          git config user.name "gacrawl-bot" && git config user.email "gacrawl-bot@users.noreply.github.com"
          git add ga/crawl/infer_ai.json research/train/infer_ai_log.jsonl
          if git diff --cached --quiet; then echo "nothing new"; exit 0; fi
          git commit -qm "Inferences by the open model (Phi-4): $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3 4 5; do git pull --rebase --autostash -q && git push -q && break; sleep $((i*5)); done
          [ -f tools/site_data.sh ] && GH_TOKEN="$SITE_TOKEN" timeout 25m bash tools/site_data.sh || echo "site data not refreshed"
      - name: Remove this run's attachments
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for id in $(gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts" --jq '.artifacts[].id'); do
            gh api -X DELETE "repos/${{ github.repository }}/actions/artifacts/$id" && echo "removed attachment $id"
          done
