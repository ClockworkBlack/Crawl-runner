name: ethics
# Georgia state and local campaign money from the State Ethics Commission's search site (gacrawl/ethics.py).
# explore: a few known filers searched, every page kept in the private repository (data/ethics_explore/) to build
# and check the reader on real pages. The crawl itself runs the reader in its merge job.
on:
  workflow_dispatch:
    inputs:
      action:
        description: "explore (save the pages for a few known filers)"
        default: "explore"

permissions:
  contents: read

concurrency:
  group: ethics
  cancel-in-progress: false

env:
  GACRAWL_USER_AGENT: "GACivicCrawler/0.3 (+https://github.com/${{ github.repository }})"
  PYTHONUNBUFFERED: "1"
  DATA_TOKEN: ${{ secrets.DATA_TOKEN }}

jobs:
  ethics:
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Runner mode
        run: bash scripts/ci_runner.sh mode
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: pip install -q -e .
      - name: Explore the search pages
        run: |
          gacrawl ethics explore --out data/ethics_explore || echo "explore stopped"
          bash scripts/ci_runner.sh push-state "ethics explore $(date -u +%Y-%m-%dT%H:%MZ)" data/ethics_explore || true
