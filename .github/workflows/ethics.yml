name: ethics
# Georgia state and local campaign money from the State Ethics Commission's search site (gacrawl/ethics.py).
# explore: a few known filers searched, every page kept in the private repository (data/ethics_explore/) to build
# and check the reader on real pages. The crawl itself runs the reader in its merge job.
on:
  workflow_dispatch:
    inputs:
      action:
        description: "explore | probe | clicks | bulk | sample (try the money reader for 4 minutes on an empty database)"
        default: "explore"
      urls:
        description: "probe: space-separated URLs"
        required: false

permissions:
  contents: read

concurrency:
  group: ethics
  cancel-in-progress: false

env:
  GACRAWL_USER_AGENT: "GACivicCrawler/0.3 (+https://github.com/${{ github.repository }})"
  PYTHONUNBUFFERED: "1"
  DATA_TOKEN: ${{ secrets.DATA_TOKEN }}

jobs:
  ethics:
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Runner mode
        run: bash scripts/ci_runner.sh mode
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: pip install -q -e .
      - name: Probe (a browser visit recording the requests a page makes; kept in the private repository)
        if: inputs.action == 'probe'
        env:
          URLS: ${{ inputs.urls }}
          GACRAWL_BROWSER_CHANNEL: chrome
        run: |
          set -f
          gacrawl probe $URLS --browser --out data/ethics_probe || echo "probe stopped"
          bash scripts/ci_runner.sh push-state "ethics probe $(date -u +%Y-%m-%dT%H:%MZ)" data/ethics_probe || true
      - name: Click the public data buttons of the current systems (PeachFile, EFile) and record their API calls
        if: inputs.action == 'clicks' || inputs.action == 'bulk'
        env:
          GACRAWL_BROWSER_CHANNEL: chrome
          ACTION: ${{ inputs.action }}
        run: |
          if [ "$ACTION" = bulk ]; then gacrawl ethics bulk --out data/ethics_probe || echo "bulk stopped"
          else gacrawl ethics clicks --out data/ethics_probe || echo "clicks stopped"; fi
          bash scripts/ci_runner.sh push-state "ethics clicks $(date -u +%Y-%m-%dT%H:%MZ)" data/ethics_probe || true
      - name: Explore the search pages
        if: inputs.action == 'explore'
        run: |
          gacrawl ethics explore --out data/ethics_explore || echo "explore stopped"
          bash scripts/ci_runner.sh push-state "ethics explore $(date -u +%Y-%m-%dT%H:%MZ)" data/ethics_explore || true
      - name: Try the reader on an empty database (a few minutes; prints what it read)
        if: inputs.action == 'sample'
        env:
          GACRAWL_DB: /tmp/ethics-sample.db
        run: |
          python3 scripts/ethics_sample.py
