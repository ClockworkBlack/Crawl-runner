name: fec-reread
# Campaign money made right without waiting for the crawl: every federal campaign's FEC receipts read again with the
# FEC line ids and memo codes (gacrawl finance --reread-only), beside the crawl rather than inside it. It works
# on a copy of the crawl database, so it never races the crawl's own upload; what it read reaches the main database
# as a delta (fec-delta.db.zst and fec-kv.json in the private crawl-data release), which the crawl merge job
# applies (gacrawl finance apply) before anything else reads money. Meanwhile the corrected money goes to the site at
# once: the Donors tab and each profile's money only (Electo tools/money_import.py), nothing else.
#
# A GitHub-hosted job may run 6 hours at most, so one run reads for 5 and hands over what it read. While old FEC lines
# remain, it starts again by itself every 6 hours (skipping when the last run's delta has not been applied yet, or when
# nothing is left to read), so the re-read finishes in a few runs without anyone starting them.
on:
  schedule:
    - cron: "40 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fec-reread
  cancel-in-progress: false

env:
  GACRAWL_USER_AGENT: "GACivicCrawler/0.3 (+https://github.com/${{ github.repository }})"
  PYTHONUNBUFFERED: "1"
  DATA_TOKEN: ${{ secrets.DATA_TOKEN }}
  DATA_TAG: crawl-data
  IS_MAIN: ${{ github.ref_name == github.event.repository.default_branch }}

jobs:
  reread:
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 345
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Runner mode and state
        run: |
          bash scripts/ci_runner.sh mode
          set -a; . <(grep -E '^(PUBLIC_RUNNER|DATA_REPO)=' "$GITHUB_ENV"); set +a
          bash scripts/ci_runner.sh pull-state
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: pip install -q -e .
      - name: Is a re-read still needed?
        id: need
        run: |
          if gh release view "$DATA_TAG" --json assets --jq '.assets[].name' 2>/dev/null | grep -qx fec-delta.db.zst; then
            echo "the last re-read's delta is still waiting for the crawl's merge job: not starting another"; echo "go=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          echo "go=true" >> "$GITHUB_OUTPUT"
      - name: A copy of the crawl database
        if: steps.need.outputs.go == 'true'
        run: bash scripts/ci_db.sh pull
      - name: Old FEC lines left to read
        id: left
        if: steps.need.outputs.go == 'true'
        run: |
          n=$(python3 scripts/fec_left.py)
          echo "old FEC lines left: $n"; echo "n=$n" >> "$GITHUB_OUTPUT"
      - name: Read every federal campaign again from the FEC
        if: steps.need.outputs.go == 'true' && steps.left.outputs.n != '0'
        env:
          FEC_API_KEY: ${{ secrets.FEC_API_KEY }}
        run: |
          [ -n "$FEC_API_KEY" ] || { echo "::error title=FEC API key::No FEC_API_KEY secret in this repository: the FEC refuses the shared DEMO_KEY after a few calls, so nothing can be re-read. Add the secret (a free key from api.open.fec.gov/developers) and run this again."; exit 1; }
          date -u +%Y-%m-%dT%H:%M:%S > start.txt
          gacrawl finance --reread-only --max-minutes 300 || echo "the re-read stopped; what it read is kept"
      - name: Hand it to the crawl (delta and lookups in the private release)
        if: steps.need.outputs.go == 'true' && steps.left.outputs.n != '0'
        run: |
          START=$(cat start.txt)
          gacrawl delta --since "$START" --out fec-delta.db
          gacrawl finance export-kv --kv fec-kv.json
          zstd -T0 -3 -q -f fec-delta.db -o fec-delta.db.zst
          gh release upload "$DATA_TAG" fec-delta.db.zst fec-kv.json --clobber
          echo "uploaded $(du -h fec-delta.db.zst | cut -f1) for the crawl's next merge"
      - name: The corrected money to the site now (Donors tab and profile money only)
        if: steps.need.outputs.go == 'true' && steps.left.outputs.n != '0' && (env.IS_MAIN == 'true')
        env:
          ELECTO_TOKEN: ${{ secrets.ELECTO_TOKEN || secrets.DATA_TOKEN }}
          ELECTO_REPO: ${{ vars.ELECTO_REPO || 'ClockworkBlack/Electo' }}
          SITE_TOKEN: ${{ secrets.SITE_DATA_TOKEN || secrets.ELECTO_TOKEN }}
          SITE_DATA_REPO: ${{ vars.SITE_DATA_REPO || 'ClockworkBlack/electo-data' }}
        run: |
          set -e
          gacrawl finance export-money --out "$PWD/dist/money"
          gacrawl coverage || true
          git clone -q --depth 1 "https://x-access-token:${ELECTO_TOKEN}@github.com/${ELECTO_REPO}.git" /tmp/electo-money
          cd /tmp/electo-money
          CRAWL_BUNDLE="$GITHUB_WORKSPACE/dist/money" python3 -I tools/money_import.py
          git config user.name "gacrawl-bot" && git config user.email "gacrawl-bot@users.noreply.github.com"
          git add -A ga/crawl/donors.json ga/crawl/donors ga/crawl/people.json    # the Donors tab, every donor's profile, profiles' money
          if git diff --cached --quiet; then echo "money unchanged"; else
            git commit -qm "Campaign money re-read from the FEC: $(date -u +%Y-%m-%dT%H:%MZ)"
            for i in 1 2 3 4 5; do git pull --rebase --autostash -q && git push -q && break; sleep $((i*5)); done
          fi
          GH_TOKEN="$SITE_TOKEN" timeout 25m bash tools/site_data.sh || echo "site data not refreshed"
      - name: Keep the coverage report (money checks)
        if: always() && steps.need.outputs.go == 'true'
        run: |
          bash scripts/ci_runner.sh push-state "fec re-read $(date -u +%Y-%m-%dT%H:%MZ)" data/coverage.md || true
