name: model-work
# The open model's writing, on its own runner instead of inside the crawl's merge job: the organizations that gave money
# are looked up in the registries (gacrawl finance orgs), then Qwen3-8B (4-bit, CPU) writes donor backgrounds (gacrawl
# donors-ai), reads the Rumor Mill's pages (rumors-text, rumors-ai) and describes federal bills (federal-bills --ai)
# for up to five hours, about twenty times the minutes the merge job could give it, and the
# merge job is shorter for it. It works on a copy of the crawl database and the kept state, so it never races the
# crawl; what it wrote travels as model-handoff.json in the private crawl-data release (gacrawl/model_handoff.py),
# which the crawl's merge job applies before its export and deletes only once the database holding it is stored.
#
# Every 6 hours, between the FEC re-read's runs; a hand-off still waiting for the crawl is carried into this run's.
# Each step checks its own output exactly as before (llm.check, the second reading, verbatim quotes), and every
# call is logged to data/train for training a model of our own; the logs travel in the hand-off too.
on:
  schedule:
    - cron: "10 2,8,14,20 * * *"
  workflow_dispatch:
    inputs:
      minutes:
        description: "minutes in all for the three tasks (default 280)"
        required: false
        default: "280"

permissions:
  contents: read

concurrency:
  group: model-work
  cancel-in-progress: false

env:
  GACRAWL_USER_AGENT: "GACivicCrawler/0.3 (+https://github.com/${{ github.repository }})"
  PYTHONUNBUFFERED: "1"
  DATA_TOKEN: ${{ secrets.DATA_TOKEN }}
  DATA_TAG: crawl-data
  IS_MAIN: ${{ github.ref_name == github.event.repository.default_branch }}

jobs:
  write:
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 345
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Runner mode and state
        run: |
          bash scripts/ci_runner.sh mode
          set -a; . <(grep -E '^(PUBLIC_RUNNER|DATA_REPO)=' "$GITHUB_ENV"); set +a
          bash scripts/ci_runner.sh pull-state
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: pip install -q -e .
      - name: Is the last hand-off still waiting for the crawl? (then it is carried, not waited for)
        id: need
        run: |
          # a hand-off the crawl has not applied yet is applied to this job's copy of the database and handed over
          # again with this job's work (one file, both runs' writing): the model no longer sits out a run waiting
          echo "go=true" >> "$GITHUB_OUTPUT"
          REPO="${GH_REPO:-$GITHUB_REPOSITORY}"
          ID=$(gh api "repos/$REPO/releases/tags/$DATA_TAG" --jq '.assets[] | select(.name=="model-handoff.json") | .id' 2>/dev/null || true)
          if [ -n "$ID" ]; then
            gh api -H 'Accept: application/octet-stream' "repos/$REPO/releases/assets/$ID" > waiting.json && echo "a hand-off is still waiting (asset $ID): it is carried into this run's"
          fi
      - name: The open model (Qwen3-8B, 4-bit; kept between runs)
        if: steps.need.outputs.go == 'true'
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-qwen3-8b-q4km-v1
      - name: llama.cpp
        if: steps.need.outputs.go == 'true'
        run: |
          pip install -q --prefer-binary "llama-cpp-python>=0.3.9" huggingface_hub \
            --extra-index-url https://abetlen.github.io/llama-cpp-python/whl/cpu
      - name: A copy of the crawl database
        if: steps.need.outputs.go == 'true'
        run: |
          bash scripts/ci_db.sh pull
          if [ -s waiting.json ]; then gacrawl model-handoff apply --in waiting.json || { echo "the waiting hand-off could not be applied here; it stays for the crawl"; rm -f waiting.json; }; fi
          gacrawl model-handoff mark --out mark.json
          echo "MW_T0=$(date +%s)" >> "$GITHUB_ENV"
      - name: What the organizations that gave money are (FEC files, State Ethics Commission, IRS)
        if: steps.need.outputs.go == 'true'
        env:
          FEC_API_KEY: ${{ secrets.FEC_API_KEY }}
        run: |
          # gacrawl/registries.py: the registries' bulk files and searches, so the model has a registration to write
          # from for every organization and committee in them (only 17 had one when lookups waited for a name search)
          timeout -s INT -k 2m 48m gacrawl finance orgs --max-minutes 40 || echo "organization lookups stopped after 48 minutes"
      - name: Meeting summaries (minutes and committee hearings; the parser's lines first)
        if: steps.need.outputs.go == 'true'
        run: |
          # gacrawl/meeting_summaries.py: a third of the time left (MEETING_SUMMARY_SHARE, percent). Minutes the crawler's
          # parser already drew motions from take one short call each; the readings travel in the hand-off
          ALL=${{ inputs.minutes || '280' }}; USED=$(( ($(date +%s) - MW_T0) / 60 )); M=$(( (ALL - USED) * ${{ vars.MEETING_SUMMARY_SHARE || '35' }} / 100 )); [ "$M" -lt 5 ] && M=5
          timeout -s INT -k 2m "$((M + 8))m" gacrawl minutes-ai --max-minutes "$M" || echo "meeting summaries stopped after $((M + 8)) minutes"
      - name: Donor backgrounds (organizations and PACs, biggest donors first)
        if: steps.need.outputs.go == 'true'
        run: |
          ALL=${{ inputs.minutes || '280' }}; USED=$(( ($(date +%s) - MW_T0) / 60 )); M=$(( (ALL - USED) * 50 / 100 )); [ "$M" -lt 5 ] && M=5
          timeout -s INT -k 2m "$((M + 8))m" gacrawl donors-ai --max-minutes "$M" || echo "donor backgrounds stopped after $((M + 8)) minutes"
      - name: Rumor Mill pages (each item's page read once) and readings
        if: steps.need.outputs.go == 'true'
        run: |
          timeout -s INT -k 1m 12m gacrawl rumors-text --max-minutes 10 || echo "rumor pages stopped after 12 minutes"
          ALL=${{ inputs.minutes || '280' }}; USED=$(( ($(date +%s) - MW_T0) / 60 )); M=$(( (ALL - USED) / 2 )); [ "$M" -lt 5 ] && M=5
          timeout -s INT -k 2m "$((M + 8))m" gacrawl rumors-ai --max-minutes "$M" || echo "rumor readings stopped after $((M + 8)) minutes"
      - name: Federal bill descriptions
        if: steps.need.outputs.go == 'true'
        run: |
          ALL=${{ inputs.minutes || '280' }}; USED=$(( ($(date +%s) - MW_T0) / 60 )); M=$(( ALL - USED )); [ "$M" -lt 5 ] && M=5
          timeout -s INT -k 2m "$((M + 8))m" gacrawl federal-bills --ai --max-minutes "$M" || echo "descriptions stopped after $((M + 8)) minutes"
      - name: Hand it to the crawl (model-handoff.json in the private release)
        if: always() && steps.need.outputs.go == 'true'
        run: |
          [ -f mark.json ] || { echo "nothing was started"; exit 0; }
          if [ -s waiting.json ]; then
            gacrawl model-handoff export --mark mark.json --out model-handoff.json --carry waiting.json | tee export.json
          else
            gacrawl model-handoff export --mark mark.json --out model-handoff.json | tee export.json
          fi
          if grep -q '"has_work": true' export.json; then :
          else echo "nothing new written (nothing was due); no hand-off uploaded"; exit 0; fi
          gh release upload "$DATA_TAG" model-handoff.json --clobber
          echo "uploaded $(du -h model-handoff.json | cut -f1) for the crawl's next merge"
