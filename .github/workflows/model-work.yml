name: model-work
# The open model's writing, on its own runner instead of inside the crawl's merge job: Qwen3-8B (4-bit, CPU) writes
# donor backgrounds (gacrawl donors-ai), reads the Rumor Mill (rumors-ai) and describes federal bills
# (federal-bills --ai) for up to five hours, about twenty times the minutes the merge job could give it, and the
# merge job is shorter for it. It works on a copy of the crawl database and the kept state, so it never races the
# crawl; what it wrote travels as model-handoff.json in the private crawl-data release (gacrawl/model_handoff.py),
# which the crawl's merge job applies before its export and deletes only once the database holding it is stored.
#
# Every 6 hours, between the FEC re-read's runs; it skips while its last hand-off still waits for the crawl.
# Each step checks its own output exactly as before (llm.check, the second reading, verbatim quotes), and every
# call is logged to data/train for training a model of our own; the logs travel in the hand-off too.
on:
  schedule:
    - cron: "10 2,8,14,20 * * *"
  workflow_dispatch:
    inputs:
      minutes:
        description: "minutes in all for the three tasks (default 280)"
        required: false
        default: "280"

permissions:
  contents: read

concurrency:
  group: model-work
  cancel-in-progress: false

env:
  GACRAWL_USER_AGENT: "GACivicCrawler/0.3 (+https://github.com/${{ github.repository }})"
  PYTHONUNBUFFERED: "1"
  DATA_TOKEN: ${{ secrets.DATA_TOKEN }}
  DATA_TAG: crawl-data
  IS_MAIN: ${{ github.ref_name == github.event.repository.default_branch }}

jobs:
  write:
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 345
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Runner mode and state
        run: |
          bash scripts/ci_runner.sh mode
          set -a; . <(grep -E '^(PUBLIC_RUNNER|DATA_REPO)=' "$GITHUB_ENV"); set +a
          bash scripts/ci_runner.sh pull-state
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: pip install -q -e .
      - name: Is the last hand-off still waiting for the crawl?
        id: need
        run: |
          if gh release view "$DATA_TAG" --json assets --jq '.assets[].name' 2>/dev/null | grep -qx model-handoff.json; then
            echo "the last hand-off has not been applied by the crawl yet: not starting another"; echo "go=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          echo "go=true" >> "$GITHUB_OUTPUT"
      - name: The open model (Qwen3-8B, 4-bit; kept between runs)
        if: steps.need.outputs.go == 'true'
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-qwen3-8b-q4km-v1
      - name: llama.cpp
        if: steps.need.outputs.go == 'true'
        run: |
          pip install -q --prefer-binary "llama-cpp-python>=0.3.9" huggingface_hub \
            --extra-index-url https://abetlen.github.io/llama-cpp-python/whl/cpu
      - name: A copy of the crawl database
        if: steps.need.outputs.go == 'true'
        run: |
          bash scripts/ci_db.sh pull
          gacrawl model-handoff mark --out mark.json
          echo "MW_T0=$(date +%s)" >> "$GITHUB_ENV"
      - name: Donor backgrounds (organizations and PACs, biggest donors first)
        if: steps.need.outputs.go == 'true'
        run: |
          ALL=${{ inputs.minutes || '280' }}; M=$(( ALL * 50 / 100 ))
          timeout -s INT -k 2m "$((M + 8))m" gacrawl donors-ai --max-minutes "$M" || echo "donor backgrounds stopped after $((M + 8)) minutes"
      - name: Rumor Mill readings
        if: steps.need.outputs.go == 'true'
        run: |
          ALL=${{ inputs.minutes || '280' }}; USED=$(( ($(date +%s) - MW_T0) / 60 )); M=$(( (ALL - USED) / 2 )); [ "$M" -lt 5 ] && M=5
          timeout -s INT -k 2m "$((M + 8))m" gacrawl rumors-ai --max-minutes "$M" || echo "rumor readings stopped after $((M + 8)) minutes"
      - name: Federal bill descriptions
        if: steps.need.outputs.go == 'true'
        run: |
          ALL=${{ inputs.minutes || '280' }}; USED=$(( ($(date +%s) - MW_T0) / 60 )); M=$(( ALL - USED )); [ "$M" -lt 5 ] && M=5
          timeout -s INT -k 2m "$((M + 8))m" gacrawl federal-bills --ai --max-minutes "$M" || echo "descriptions stopped after $((M + 8)) minutes"
      - name: Hand it to the crawl (model-handoff.json in the private release)
        if: always() && steps.need.outputs.go == 'true'
        run: |
          [ -f mark.json ] || { echo "nothing was started"; exit 0; }
          gacrawl model-handoff export --mark mark.json --out model-handoff.json
          gh release upload "$DATA_TAG" model-handoff.json --clobber
          echo "uploaded $(du -h model-handoff.json | cut -f1) for the crawl's next merge"
