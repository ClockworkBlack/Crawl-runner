# Watchdog: keeps the whole chain hands-off. Runs in the PUBLIC runner repository only (free minutes), every three
# hours. It checks that each part of the chain has done its work recently and repairs what it can on its own:
#   - the crawl, police and news runs have left fresh commits (else it starts that workflow again, once, if none is
#     already queued or running)
#   - the public site (electo-data) has been rebuilt recently (else it starts publish-site and news), and has not
#     waited over an hour for Electo's newest commit (else it starts publish-site)
#   - every other scheduled job (news, publish-site, results, sync-code, fec-reread, ga-money, model-work, the ai-* jobs)
#     has succeeded within twice its usual gap, from the outcomes sync-code records in runner-status.json (a crawl-data
#     release asset) before it deletes each run (else it starts the job again; still failing, it is reported)
#   - the tokens the chain depends on are not about to expire (it cannot renew them; it warns two weeks ahead)
# Anything it can't fix, or that stays broken after a restart, goes into one "Watchdog" issue in the private Crawl
# repository (GitHub emails you); the issue closes itself once everything is healthy again. No Claude needed.
name: watchdog
on:
  schedule:
    - cron: "53 */3 * * *"
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: watchdog
  cancel-in-progress: false

jobs:
  watch:
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DATA_TOKEN: ${{ secrets.DATA_TOKEN }}
      ELECTO_TOKEN: ${{ secrets.ELECTO_TOKEN }}
      ELECTO_REPO: ${{ vars.ELECTO_REPO || 'ClockworkBlack/Electo' }}
      SITE_TOKEN: ${{ secrets.SITE_DATA_TOKEN || secrets.ELECTO_TOKEN || secrets.DATA_TOKEN }}
      RUNNER_TOKEN: ${{ github.token }}
      RUNNER_REPO: ${{ github.repository }}
      DATA_REPO: ClockworkBlack/Crawl
      SITE_DATA_REPO: ${{ vars.SITE_DATA_REPO || 'ClockworkBlack/electo-data' }}
      # how old (hours) each sign of life may get before the watchdog acts
      MAX_CRAWL_H: ${{ vars.WATCH_CRAWL_HOURS || '30' }}
      MAX_POLICE_H: ${{ vars.WATCH_POLICE_HOURS || '30' }}
      MAX_NEWS_H: ${{ vars.WATCH_NEWS_HOURS || '8' }}
      MAX_SITE_H: ${{ vars.WATCH_SITE_HOURS || '8' }}
      MAX_STEP_H: ${{ vars.WATCH_STEP_HOURS || '4' }}    # longest any one step may run (candidate research on the runner is 200 min)
    steps:
      - name: Check the chain and repair what can be repaired
        run: |
          python3 - <<'PY'
          import datetime as dt, json, os, urllib.request, urllib.error

          now = dt.datetime.now(dt.timezone.utc)
          problems, repairs = [], []

          def api(path, token, method="GET", body=None, headers_out=None):
              req = urllib.request.Request("https://api.github.com/" + path, method=method,
                                           data=json.dumps(body).encode() if body is not None else None)
              req.add_header("Authorization", f"Bearer {token}")
              req.add_header("Accept", "application/vnd.github+json")
              req.add_header("User-Agent", "crawl-watchdog")
              try:
                  with urllib.request.urlopen(req, timeout=30) as r:
                      if headers_out is not None:
                          headers_out.update(r.headers)
                      txt = r.read()
                      return json.loads(txt) if txt else {}
              except urllib.error.HTTPError as e:
                  return {"_error": e.code, "_msg": e.read()[:300].decode(errors="replace")}
              except Exception as e:
                  return {"_error": type(e).__name__}

          def hours_since(iso):
              return (now - dt.datetime.fromisoformat(iso.replace("Z", "+00:00"))).total_seconds() / 3600

          # 1. tokens: valid, and not expiring within 14 days
          for name in ("DATA_TOKEN", "ELECTO_TOKEN", "SITE_TOKEN"):
              tok = os.environ.get(name, "")
              if not tok:
                  continue
              h = {}
              r = api("rate_limit", tok, headers_out=h)
              if isinstance(r, dict) and r.get("_error") in (401, 403):
                  problems.append(f"**{name} no longer works** (HTTP {r['_error']}). Make a new token and replace the secret; the chain stops moving data until then.")
                  continue
              exp = h.get("github-authentication-token-expiration")
              if exp:
                  left = (dt.datetime.strptime(exp[:19], "%Y-%m-%d %H:%M:%S").replace(tzinfo=dt.timezone.utc) - now).days
                  if left < 14:
                      problems.append(f"**{name} expires in {left} days** ({exp}). Renew it (or make a new one) and update the secret before then.")

          data_tok = os.environ["DATA_TOKEN"]
          runner_tok = os.environ["RUNNER_TOKEN"]
          data_repo, runner_repo = os.environ["DATA_REPO"], os.environ["RUNNER_REPO"]

          # 2. last commit whose message starts with a prefix, in the private data repo
          commits = api(f"repos/{data_repo}/commits?per_page=100", data_tok)
          if not isinstance(commits, list):
              problems.append(f"Couldn't read the private Crawl repository ({commits.get('_error')}); check DATA_TOKEN.")
              commits = []

          def last(prefixes):
              for c in commits:
                  msg = c["commit"]["message"].split("\n")[0].lower()
                  if any(msg.startswith(p) for p in prefixes):
                      return hours_since(c["commit"]["committer"]["date"])
              return None

          def runs(workflow):
              r = api(f"repos/{runner_repo}/actions/workflows/{workflow}/runs?per_page=5", runner_tok)
              return r.get("workflow_runs") or [] if isinstance(r, dict) else []

          def busy(workflow):
              return any(w["status"] in ("queued", "in_progress", "waiting", "pending", "requested") for w in runs(workflow))

          def stuck(workflow):
              """A run whose current step has been going longer than any step is allowed to (MAX_STEP_H). A busy run
              used to count as healthy; on Nov 8 one step without a time cap hung the merge job for hours, the backfill
              chain stopped with it, and nothing noticed until the job's own timeout."""
              for w in runs(workflow):
                  if w["status"] != "in_progress":
                      continue
                  jobs = api(f"repos/{runner_repo}/actions/runs/{w['id']}/jobs?per_page=50", runner_tok)
                  for j in (jobs.get("jobs") or []) if isinstance(jobs, dict) else []:
                      if j.get("status") != "in_progress":
                          continue
                      for s in j.get("steps") or []:
                          if s.get("status") == "in_progress" and s.get("started_at") and hours_since(s["started_at"]) > MAX_STEP_H:
                              return w, j, s
              return None

          restarted = set()

          def restart(workflow, why, force=False):
              if workflow in restarted:          # once per check, whatever asked for it
                  repairs.append(f"{workflow}: {why} (already started again in this check)")
                  return
              restarted.add(workflow)
              if not force and busy(workflow):
                  repairs.append(f"{workflow}: {why}, but a run is already going; leaving it be")
                  return
              r = api(f"repos/{runner_repo}/actions/workflows/{workflow}/dispatches", runner_tok, "POST", {"ref": "main"})
              if r.get("_error"):
                  problems.append(f"{workflow}: {why}, and restarting it failed (HTTP {r['_error']}).")
              else:
                  repairs.append(f"{workflow}: {why}; started it again")

          MAX_STEP_H = float(os.environ["MAX_STEP_H"])
          checks = [("crawl.yml", ["crawl:"], float(os.environ["MAX_CRAWL_H"])),
                    ("police.yml", ["police:", "police data:"], float(os.environ["MAX_POLICE_H"]))]
          for wf, prefixes, max_h in checks:
              hung = stuck(wf)
              if hung:
                  w, j, s = hung
                  # force-cancel: a plain cancel waits on the hung step and may never take (Nov 8: 20+ minutes and still
                  # running). A force-cancelled run skips its own cleanup step, so its attachments are removed here.
                  r = api(f"repos/{runner_repo}/actions/runs/{w['id']}/force-cancel", runner_tok, "POST")
                  why = f"run {w['id']} was stuck in '{s['name']}' ({j['name']}) for {hours_since(s['started_at']):.1f}h"
                  if r.get("_error") and r["_error"] != 409:      # 409: already cancelling
                      problems.append(f"**{wf}**: {why}, and cancelling it failed (HTTP {r['_error']}).")
                  else:
                      arts = api(f"repos/{runner_repo}/actions/runs/{w['id']}/artifacts", runner_tok)
                      for a in (arts.get("artifacts") or []) if isinstance(arts, dict) else []:
                          api(f"repos/{runner_repo}/actions/artifacts/{a['id']}", runner_tok, "DELETE")
                      repairs.append(f"{wf}: {why}; cancelled it and removed its attachments")
                      restart(wf, "after the stuck run", force=True)   # queues behind the cancellation, then runs
                      continue
              age = last(prefixes)
              if age is None or age > max_h:
                  why = "no run in the last 100 commits" if age is None else f"last data {age:.0f}h ago"
                  restart(wf, why)
                  if age is not None and age > max_h * 2:
                      problems.append(f"**{wf}** hasn't delivered data in {age:.0f} hours, even after restarts. Its logs are in logs/runner/ in the private Crawl repository.")
              elif wf == "crawl.yml" and not busy(wf):
                  # the backfill chain hands off at the end of each run; a run that died (timeout, failure, cancelled)
                  # hands off to nothing, so start the next link ourselves
                  ended = [w for w in runs(wf) if w["status"] == "completed"]
                  if ended and ended[0].get("conclusion") not in ("success", "skipped", None) and age is not None and age > 2:
                      restart(wf, f"the last run ended with '{ended[0]['conclusion']}' and nothing has run since ({age:.0f}h)")

          # 3. the public site / feed
          site_tok = os.environ.get("SITE_TOKEN") or data_tok
          sc = api(f"repos/{os.environ['SITE_DATA_REPO']}/commits?per_page=1", site_tok)
          if isinstance(sc, list) and sc:
              age = hours_since(sc[0]["commit"]["committer"]["date"])
              if age > float(os.environ["MAX_SITE_H"]):
                  restart("news.yml", f"public site last updated {age:.0f}h ago")
                  restart("publish-site.yml", f"public site last updated {age:.0f}h ago")
                  if age > float(os.environ["MAX_SITE_H"]) * 3:
                      problems.append(f"**The public site** hasn't been updated in {age:.0f} hours, even after restarts.")
          else:
              problems.append(f"Couldn't read {os.environ['SITE_DATA_REPO']} ({sc.get('_error') if isinstance(sc, dict) else 'empty'}); check the site token.")

          # 3b. Electo commits the site hasn't been rebuilt from (a change to the page or a hand import waits for
          #     publish-site, whose 20-minute schedule GitHub sometimes skips under load)
          if isinstance(sc, list) and sc:
              head = api(f"repos/{os.environ['ELECTO_REPO']}/commits/main", os.environ.get("ELECTO_TOKEN") or data_tok)
              cur = api(f"repos/{os.environ['SITE_DATA_REPO']}/contents/current.json", site_tok)
              try:
                  import base64
                  built_from = json.loads(base64.b64decode(cur["content"]))["commit"]
              except Exception:
                  built_from = ""
              if isinstance(head, dict) and head.get("sha") and built_from and not head["sha"].startswith(built_from):
                  waiting = hours_since(head["commit"]["committer"]["date"])
                  if waiting > 1:
                      restart("publish-site.yml", f"Electo's newest commit ({head['sha'][:7]}) has waited {waiting:.1f}h for the site")
                  if waiting > 4:
                      problems.append(f"**The public site** is {waiting:.0f} hours behind Electo's main ({head['sha'][:7]}; built from {built_from}), even after restarts.")

          # 3c. every other scheduled job: sync-code records each finished run (runner-status.json in the private
          #     crawl-data release) before it deletes the run here. A job with no success for twice its usual gap is
          #     started again; one still without a success, or failing three times in a row, is reported.
          import subprocess
          r = subprocess.run(["gh", "release", "download", "crawl-data", "-R", data_repo, "-p", "runner-status.json", "-O", "-"],
                             capture_output=True, text=True, env=dict(os.environ, GH_TOKEN=data_tok))
          try:
              status = json.loads(r.stdout) if r.returncode == 0 else {}
          except ValueError:
              status = {}
          # workflow name -> (file, hours a success may be apart before a restart)
          jobs = {"news": ("news.yml", 8), "publish-site": ("publish-site.yml", 2), "results": ("results.yml", 2),
                  "sync-code": ("sync-code.yml", 2), "fec-reread": ("fec-reread.yml", 20), "ga-money": ("ga-money.yml", 20),
                  "model-work": ("model-work.yml", 20), "ai-outlook": ("ai-outlook.yml", 20),
                  "ai-profiles": ("ai-profiles.yml", 40), "ai-infer": ("ai-infer.yml", 40),
                  "crawl": ("crawl.yml", None), "police": ("police.yml", None)}     # crawl, police: checked above by their data
          for name, (wf, max_h) in jobs.items():
              w = status.get(name)
              if not w:
                  continue                       # not recorded yet (new job, or the status file is new)
              ok_at = (w.get("last_success") or {}).get("at")
              fails = w.get("fails_in_row") or 0
              last = w.get("last") or {}
              age = hours_since(ok_at) if ok_at else None
              # three failures in a row matter once the job has also gone its usual gap without a success (a job that
              # runs every 20 minutes can fail three times to a passing outage of the site it reads)
              if fails >= 3 and (max_h is None or age is None or age > max_h):
                  problems.append(f"**{wf}** has failed {fails} times in a row (last: {last.get('conclusion')} at {last.get('at')}). "
                                  f"Its logs are in logs/runner/ in the private Crawl repository.")
              if max_h is None:
                  continue
              if age is not None and age > max_h:
                  restart(wf, f"no successful run in {age:.0f}h")
                  if age > max_h * 2:
                      problems.append(f"**{wf}** hasn't succeeded in {age:.0f} hours, even after restarts.")
          if r.returncode != 0 and "release asset" not in (r.stderr or "") and "no assets" not in (r.stderr or "").lower():
              repairs.append(f"run status not read ({(r.stderr or '').strip()[:120]})")

          # 4. report: one issue in the private repo, opened/updated on problems, closed when healthy
          print("\n".join(["repairs:"] + repairs + ["problems:"] + problems))
          issues = api(f"repos/{data_repo}/issues?state=open&labels=watchdog&per_page=5", data_tok)
          open_issue = issues[0] if isinstance(issues, list) and issues else None
          stamp = now.strftime("%Y-%m-%d %H:%M UTC")
          if problems:
              body = (f"Checked {stamp}.\n\n**Needs you:**\n" + "\n".join(f"- {p}" for p in problems)
                      + ("\n\n**Repaired automatically:**\n" + "\n".join(f"- {r}" for r in repairs) if repairs else "")
                      + "\n\nThis issue closes itself once everything is healthy.")
              if open_issue:
                  api(f"repos/{data_repo}/issues/{open_issue['number']}", data_tok, "PATCH", {"body": body})
              else:
                  api(f"repos/{data_repo}/issues", data_tok, "POST",
                      {"title": "Watchdog: the chain needs attention", "body": body, "labels": ["watchdog"]})
          elif open_issue:
              api(f"repos/{data_repo}/issues/{open_issue['number']}/comments", data_tok, "POST",
                  {"body": f"Healthy again as of {stamp}." + ("\n\n" + "\n".join(f"- {r}" for r in repairs) if repairs else "")})
              api(f"repos/{data_repo}/issues/{open_issue['number']}", data_tok, "PATCH", {"state": "closed"})
          PY
