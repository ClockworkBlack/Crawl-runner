name: meeting-summaries
# What each meeting took up and decided, written by the open model (Qwen3-8B, 4-bit, CPU) from its minutes or its
# recording's captions (gacrawl/meeting_summaries.py): city, county and school board minutes, the state boards'
# minutes, and the General Assembly's committee hearings. It runs beside model-work (donor backgrounds, Rumor Mill
# readings, federal bills), so the backlog of minutes costs those nothing.
#
# Sharded: the model is held back by one runner's CPU and asks no website for anything, so N runners read N times
# as many meetings. Each shard reads the meetings whose address hashes to it (gacrawl minutes-ai --shard i/N), so
# none is read twice. How many shards: the plan job counts the jobs already running on the account and leaves room
# for the others' bursts (the crawl, the AI jobs' own shards) under the account's limit on jobs at once:
#   N = ACCOUNT_JOB_LIMIT - jobs running now - JOB_RESERVE (8), between 1 and MEETING_SUMMARY_MAX_SHARDS (16).
# ACCOUNT_JOB_LIMIT is 40 (GitHub Pro, the account's plan since Nov 2026). When the plan ends the limit falls to 20:
# jobs then wait in line for a slot, and a plan job that finds any job of this repository waiting more than three
# minutes sizes the run for 20 instead, so the shards never crowd out the crawl. Variables of this repository change
# any of the numbers.
# Once the backlog is read, each shard finds nothing to do and ends within minutes.
#
# Each shard works on its own copy of the crawl database, with every hand-off still waiting applied first, and hands
# over meetings-handoff-<i>.json in the private crawl-data release (gacrawl/model_handoff.py: meeting_summary records
# and the training log only), carrying its own waiting one. The crawl's merge job applies every meetings-handoff*.json
# before its export and deletes each only once the database holding it is stored. Every 6 hours.
on:
  schedule:
    - cron: "40 5,11,17,23 * * *"
  workflow_dispatch:
    inputs:
      minutes:
        description: "minutes of reading (default 290)"
        required: false
        default: "290"

permissions:
  contents: read
  actions: read          # the plan job counts the jobs running on the account

concurrency:
  group: meeting-summaries
  cancel-in-progress: false

env:
  GACRAWL_USER_AGENT: "GACivicCrawler/0.3 (+https://github.com/${{ github.repository }})"
  PYTHONUNBUFFERED: "1"
  DATA_TOKEN: ${{ secrets.DATA_TOKEN }}
  DATA_TAG: crawl-data
  IS_MAIN: ${{ github.ref_name == github.event.repository.default_branch }}

jobs:
  plan:
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      shards: ${{ steps.n.outputs.shards }}
    steps:
      - name: How many shards
        id: n
        env:
          GH_TOKEN: ${{ github.token }}
          LIMIT: ${{ vars.ACCOUNT_JOB_LIMIT || '40' }}
          FREE_LIMIT: "20"
          RESERVE: ${{ vars.JOB_RESERVE || '8' }}
          MAX: ${{ vars.MEETING_SUMMARY_MAX_SHARDS || '16' }}
          DATA_REPO: ${{ vars.DATA_REPO || 'ClockworkBlack/Crawl' }}
          DATA_TOKEN: ${{ secrets.DATA_TOKEN }}
        run: |
          # jobs running now in this repository and in the private one (the token may not see the private one: then 0)
          # (a repository the token cannot read counts 0: gh prints the error's body, so only whole numbers are counted)
          running() {
            local repo=$1 n=0 c ids
            ids=$(gh api "repos/$repo/actions/runs?status=in_progress&per_page=100" --jq '.workflow_runs[].id' 2>/dev/null) || ids=""
            for id in $ids; do
              [[ "$id" =~ ^[0-9]+$ ]] || continue
              c=$(gh api "repos/$repo/actions/runs/$id/jobs?per_page=100" --jq '[.jobs[] | select(.status=="in_progress")] | length' 2>/dev/null) || c=0
              [[ "$c" =~ ^[0-9]+$ ]] || c=0
              n=$((n + c))
            done
            echo $n
          }
          # jobs waiting more than three minutes for a slot: the account is at its limit (the paid plan ended?)
          waiting() {
            local n=0 c id
            for id in $( (gh api "repos/$GITHUB_REPOSITORY/actions/runs?status=queued&per_page=100" --jq '.workflow_runs[].id';
                          gh api "repos/$GITHUB_REPOSITORY/actions/runs?status=in_progress&per_page=100" --jq '.workflow_runs[].id') 2>/dev/null); do
              [[ "$id" =~ ^[0-9]+$ ]] && [ "$id" != "$GITHUB_RUN_ID" ] || continue
              c=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$id/jobs?per_page=100" --jq \
                  '[.jobs[] | select(.status=="queued" and ((now - (.created_at | fromdateiso8601)) > 180))] | length' 2>/dev/null) || c=0
              [[ "$c" =~ ^[0-9]+$ ]] || c=0
              n=$((n + c))
            done
            echo $n
          }
          WAIT=$(waiting)
          if [ "$WAIT" -gt 0 ] && [ "$LIMIT" -gt "$FREE_LIMIT" ]; then
            echo "::warning::$WAIT job(s) waiting for a slot: sized for $FREE_LIMIT jobs at once, not $LIMIT"
            LIMIT=$FREE_LIMIT
          fi
          HERE=$(running "$GITHUB_REPOSITORY")
          THERE=$( [ -n "$DATA_TOKEN" ] && GH_TOKEN="$DATA_TOKEN" running "$DATA_REPO" || echo 0)
          BUSY=$(( HERE + THERE - 1 ))        # less this job itself
          N=$(( LIMIT - BUSY - RESERVE )); [ "$N" -gt "$MAX" ] && N=$MAX; [ "$N" -lt 1 ] && N=1
          echo "jobs running: $HERE here, $THERE in $DATA_REPO; limit $LIMIT, reserve $RESERVE, at most $MAX -> $N shards"
          echo "shards=$(python3 -c "import json;print(json.dumps([f'{i}/$N' for i in range($N)]))")" >> "$GITHUB_OUTPUT"
  write:
    needs: plan
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 345
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJson(needs.plan.outputs.shards) }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Runner mode and state
        run: |
          bash scripts/ci_runner.sh mode
          set -a; . <(grep -E '^(PUBLIC_RUNNER|DATA_REPO)=' "$GITHUB_ENV"); set +a
          bash scripts/ci_runner.sh pull-state
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: pip install -q -e .
      - name: Hand-offs still waiting for the crawl (all applied to this copy; this shard's own carried)
        id: need
        run: |
          # every meetings hand-off the crawl has not applied yet is applied to this shard's copy of the database, so no
          # meeting is read again; this shard's own (meetings-handoff-<i>.json) is handed over again with its new work
          echo "go=true" >> "$GITHUB_OUTPUT"
          I=${{ strategy.job-index }}
          echo "SHARD_I=$I" >> "$GITHUB_ENV"
          REPO="${GH_REPO:-$GITHUB_REPOSITORY}"
          mkdir -p waiting
          gh api "repos/$REPO/releases/tags/$DATA_TAG" --jq '.assets[] | select(.name|test("^meetings-handoff(-[0-9]+)?\\.json$")) | "\(.id) \(.name)"' 2>/dev/null |
          while read -r ID NAME; do
            gh api -H 'Accept: application/octet-stream' "repos/$REPO/releases/assets/$ID" > "waiting/$NAME" && echo "waiting: $NAME (asset $ID)"
          done
          if [ -s "waiting/meetings-handoff-$I.json" ]; then cp "waiting/meetings-handoff-$I.json" waiting.json; echo "this shard's own is carried"; fi
      - name: The open model (Qwen3-8B, 4-bit; kept between runs)
        if: steps.need.outputs.go == 'true'
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-qwen3-8b-q4km-v1
      - name: llama.cpp
        if: steps.need.outputs.go == 'true'
        run: |
          pip install -q --prefer-binary "llama-cpp-python>=0.3.9" huggingface_hub \
            --extra-index-url https://abetlen.github.io/llama-cpp-python/whl/cpu
      - name: A copy of the crawl database
        if: steps.need.outputs.go == 'true'
        run: |
          bash scripts/ci_db.sh pull
          for f in waiting/*.json; do
            [ -s "$f" ] || continue
            gacrawl model-handoff apply --in "$f" > /dev/null || { echo "$f could not be applied here; it stays for the crawl"; [ "$(basename "$f")" = "meetings-handoff-$SHARD_I.json" ] && rm -f waiting.json; }
          done
          gacrawl model-handoff mark --out mark.json
          echo "MW_T0=$(date +%s)" >> "$GITHUB_ENV"
      - name: Minutes and committee hearings read (shard ${{ matrix.shard }}; the parser's lines first, newest first)
        if: steps.need.outputs.go == 'true'
        run: |
          M=${{ inputs.minutes || '290' }}
          timeout -s INT -k 2m "$((M + 8))m" gacrawl minutes-ai --max-minutes "$M" --shard "${{ matrix.shard }}" > read.json || echo "meeting summaries stopped after $((M + 8)) minutes"
          cat read.json 2>/dev/null || true
      - name: Hand it to the crawl (meetings-handoff-<i>.json in the private release)
        if: always() && steps.need.outputs.go == 'true'
        run: |
          [ -f mark.json ] || { echo "nothing was started"; exit 0; }
          # only this job's own writing travels: the readings and their training log
          if [ -s waiting.json ]; then
            gacrawl model-handoff export --mark mark.json --out "meetings-handoff-$SHARD_I.json" --only records,train --kinds meeting_summary --carry waiting.json | tee export.json
          else
            gacrawl model-handoff export --mark mark.json --out "meetings-handoff-$SHARD_I.json" --only records,train --kinds meeting_summary | tee export.json
          fi
          if grep -q '"has_work": true' export.json; then :
          else echo "nothing new written (nothing was due); no hand-off uploaded"; exit 0; fi
          gh release upload "$DATA_TAG" "meetings-handoff-$SHARD_I.json" --clobber
          echo "uploaded meetings-handoff-$SHARD_I.json, $(du -h "meetings-handoff-$SHARD_I.json" | cut -f1), for the crawl's next merge"
