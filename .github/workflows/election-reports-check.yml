name: election-reports-check
# A dry run of the county election-report finder (gacrawl elections reports --dry-run): what it would find for these
# counties, printed to the log. Nothing is stored; the nightly crawl does the real run.
on:
  workflow_dispatch:
    inputs:
      counties:
        description: "county ids, comma-separated (co-dekalb,co-fulton,...)"
        required: true
      cap:
        description: "web searches"
        required: false
        default: "40"
permissions:
  contents: read
env:
  PYTHONUNBUFFERED: "1"
  GACRAWL_USER_AGENT: "GACivicCrawler/0.3 (+https://github.com/${{ github.repository }})"
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: pip install -q -e .
      - env:
          COUNTIES: ${{ inputs.counties }}
          CAP: ${{ inputs.cap }}
        run: gacrawl elections reports --dry-run --counties "$COUNTIES" --cap "$CAP" --max-minutes 22
