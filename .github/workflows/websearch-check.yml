# A quick live check of the discovery step's web search (gacrawl/websearch.py, DuckDuckGo through ddgs, no key):
# a few real Georgia queries from a GitHub runner, results printed to the log. Nothing is saved or committed.
name: websearch-check
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: pip install -q -e .
      - name: Search
        run: |
          python - <<'PY'
          import tempfile
          from gacrawl.websearch import Search
          s = Search(tempfile.mkdtemp(), {"ballotpedia.org"})
          qs = ["Fulton County Commission candidates 2026", "Savannah city council election 2025 results",
                "Georgia Secretary of State election results", "Macon-Bibb County mayor", "Athens-Clarke County commission district 2"]
          ok = 0
          for q in qs:
              r = s.search(q)
              ok += bool(r)
              print(f"\n== {q}: {len(r)} results")
              for x in r[:5]:
                  print("  ", x["url"])
          print(f"\n{ok}/{len(qs)} queries returned results")
          raise SystemExit(0 if ok >= 3 else 1)
          PY
