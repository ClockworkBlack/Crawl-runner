name: ai-replay
# The monthly trials: logged calls of the open-model jobs replayed through other models, each scored by its job's own
# checker, so a job moves to another model only after that model has done the job's work better on the same inputs
# (Electo tools/ai/replay.py; results in research/train/replay.json):
#   profile_write  topic sentences for profiles (with the job's second try when the first fails its checker)
#   news_summary   two-sentence news summaries (the checker and the numbers rule)
#   profile_sort   sorting a candidate's sentences into positions (answers given; agreement with the logged ones)
# On its schedule (the 3rd of each month) it replays what Electo's tools/ai/models.json asks for: every job with models
# in its "try" list, through its own model and through each of those; then `replay.py --decide` moves a job to a tried
# model only on a clear win (passes more often on the same items, beyond chance, and not slower) and writes that into
# models.json, which the jobs read. Nothing to try: the run ends in seconds. The pass-rate watch (watchdog.yml) undoes
# a move that does worse on live work. Started by hand (Actions -> ai-replay -> Run workflow) with models and tasks,
# it replays just those and decides nothing unless "decide" is ticked.
on:
  schedule:
    - cron: "17 5 3 * *"
  workflow_dispatch:
    inputs:
      models:
        description: 'models, a JSON list of keys in Electo tools/ai/models.json (qwen3, qwen35, phi4, gemma4); empty: what models.json asks for'
        default: ''
      tasks:
        description: 'tasks, a JSON list: profile_write, news_summary, profile_sort'
        default: '["profile_write","news_summary","profile_sort"]'
      minutes:
        description: "minutes of model time per runner"
        default: "230"
      decide:
        description: "move a job to a model that clearly won (always on when models is empty)"
        type: boolean
        default: false

permissions:
  contents: read
  actions: write        # remove this run's attachments at the end

concurrency:
  group: ai-replay-${{ github.ref_name }}
  cancel-in-progress: false

env:
  PYTHONUNBUFFERED: "1"
  IS_MAIN: ${{ github.ref_name == github.event.repository.default_branch }}

jobs:
  plan:
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - name: What to replay
        id: plan
        env:
          ELECTO_TOKEN: ${{ secrets.ELECTO_TOKEN || secrets.DATA_TOKEN }}
          ELECTO_REPO: ${{ vars.ELECTO_REPO || 'ClockworkBlack/Electo' }}
          MODELS: ${{ inputs.models }}
          TASKS: ${{ inputs.tasks || '["profile_write","news_summary","profile_sort"]' }}
        run: |
          if [ -n "$MODELS" ]; then
            M=$(python3 -c "import json,os; print(json.dumps([{'model': m, 'task': t} for t in json.loads(os.environ['TASKS']) for m in json.loads(os.environ['MODELS'])]))")
          else
            git clone -q --depth 1 --filter=blob:none --sparse "https://x-access-token:${ELECTO_TOKEN}@github.com/${ELECTO_REPO}.git" electo
            (cd electo && git sparse-checkout set --no-cone /tools/ai/)
            M=$(cd electo && python3 -I tools/ai/replay.py --plan)
          fi
          echo "matrix=$M" | tee -a "$GITHUB_OUTPUT"
          [ "$M" != "[]" ] || echo "::notice::no job has a model to try (Electo tools/ai/models.json): nothing to replay"

  replay:
    needs: [plan]
    if: github.event.repository.private == false && needs.plan.outputs.matrix != '[]' && needs.plan.outputs.matrix != ''
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix) }}
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      ELECTO_LLM_MODEL: ${{ matrix.model }}
    steps:
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Electo (the job logs and the jobs' code)
        env:
          ELECTO_TOKEN: ${{ secrets.ELECTO_TOKEN || secrets.DATA_TOKEN }}
          ELECTO_REPO: ${{ vars.ELECTO_REPO || 'ClockworkBlack/Electo' }}
        run: |
          git clone -q --depth 1 --filter=blob:none --sparse "https://x-access-token:${ELECTO_TOKEN}@github.com/${ELECTO_REPO}.git" electo
          cd electo && git sparse-checkout set --no-cone /tools/ai/ /tools/profile_ai/ /ga/written.py \
            /research/train/profile_write_log.jsonl /research/train/news_ai_log.jsonl /research/train/profile_ai_log.jsonl
          git remote set-url origin "https://github.com/${ELECTO_REPO}.git"
      - name: Which model (a key in tools/ai/models.json)
        id: which
        run: cd electo && python3 -I tools/ai/llm.py --model "${{ matrix.model }}" | tee -a "$GITHUB_OUTPUT"
      - name: The open model (kept between runs when the cache has room)
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: ${{ steps.which.outputs.key }}
      - name: llama.cpp (CPU build)
        run: pip install -q --prefer-binary "llama-cpp-python>=0.3.36" numpy huggingface_hub --extra-index-url https://abetlen.github.io/llama-cpp-python/whl/cpu
      - name: Replay
        run: |
          M="${{ inputs.minutes || '230' }}"
          cd electo && timeout -s INT -k 2m "$((M + 10))m" python3 -I tools/ai/replay.py --task ${{ matrix.task }} \
            --minutes "$M" --out ../part.json || echo "stopped"
          [ -f ../part.json ] || echo '{"rows":[]}' > ../part.json
      - name: Did it answer?
        run: |
          python3 -c "import json,sys; r=json.load(open('part.json')).get('rows') or []; print(len(r), 'replayed,', sum(1 for x in r if x.get('ok')), 'passed'); sys.exit(0 if r else 1)" \
            || { echo "::error::nothing replayed by ${{ matrix.model }} on ${{ matrix.task }}: see the step above"; exit 1; }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: replay-${{ matrix.model }}-${{ matrix.task }}
          path: part.json
          retention-days: 2

  combine:
    needs: [plan, replay]
    if: always() && github.event.repository.private == false && needs.replay.result != 'skipped'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - uses: actions/download-artifact@v4
        with: {pattern: "replay-*", path: parts}
        continue-on-error: true
      - name: Combine into Electo
        if: env.IS_MAIN == 'true'
        env:
          ELECTO_TOKEN: ${{ secrets.ELECTO_TOKEN || secrets.DATA_TOKEN }}
          ELECTO_REPO: ${{ vars.ELECTO_REPO || 'ClockworkBlack/Electo' }}
          DECIDE: ${{ github.event_name == 'schedule' || inputs.decide == true || inputs.models == '' }}
        run: |
          set -e
          S="$PWD/parts"; mkdir -p "$S"
          ls "$S"/*/part.json >/dev/null 2>&1 || { echo "::error::no part came back"; exit 1; }
          git clone -q --depth 1 --filter=blob:none --sparse "https://x-access-token:${ELECTO_TOKEN}@github.com/${ELECTO_REPO}.git" /tmp/electo-ai
          cd /tmp/electo-ai && git sparse-checkout set --no-cone /tools/ai/ /tools/profile_ai/ /ga/written.py /research/train/replay.json
          git config user.name "gacrawl-bot" && git config user.email "gacrawl-bot@users.noreply.github.com"
          for i in 1 2 3 4 5; do
            git fetch -q --depth 1 origin main && git reset -q --hard FETCH_HEAD
            python3 -I tools/ai/replay.py --combine "$S"/*/part.json
            if [ "$DECIDE" = "true" ]; then python3 -I tools/ai/replay.py --decide; fi
            git add research/train/replay.json tools/ai/models.json
            if git diff --cached --quiet; then echo "nothing new"; break; fi
            git commit -qm "Open-model jobs replayed through other models: $(date -u +%Y-%m-%dT%H:%MZ)"
            git push -q origin HEAD:main && break
            [ "$i" -lt 5 ] || { echo "::error::the replay results could not be pushed to Electo"; exit 1; }
            sleep $((i * 10))
          done
      - name: Remove this run's attachments
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for id in $(gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts" --jq '.artifacts[].id'); do
            gh api -X DELETE "repos/${{ github.repository }}/actions/artifacts/$id" && echo "removed attachment $id"
          done
